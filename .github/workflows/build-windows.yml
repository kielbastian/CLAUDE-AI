name: Build CAM Generator EXE

# Buduje portable CAM-Generator.exe (generator G-code) na runnerze Windows
# i udostępnia go jako artefakt kompilacji.
# UWAGA: ten workflow NIE publikuje do release "windows-exe" — ten release
# należy do osobnej aplikacji (menedżer programów CNC).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAM-Generator-windows
          path: dist/CAM-Generator.exe
