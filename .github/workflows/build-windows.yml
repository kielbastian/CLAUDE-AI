name: Budowa aplikacji Windows (exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'claude/**' ]
    paths:
      - index.html
      - detail.html
      - widget.html
      - preload.js
      - main.js
      - package.json
      - vendor/**
      - build/**
      - .github/workflows/build-windows.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności
        run: npm install

      - name: Budowa przenośnego exe
        run: npx electron-builder --win portable --publish never

      # ZIP zawiera TYLKO samodzielny CNC-Manager.exe — spakowanie sprawia, że
      # pobieranie przechodzi bez fałszywego alarmu antywirusa, a po rozpakowaniu
      # użytkownik ma jeden plik, który działa z dowolnego miejsca.
      - name: Spakuj przenośny exe do ZIP
        run: Compress-Archive -Path dist\CNC-Manager.exe -DestinationPath dist\CNC-Manager-windows.zip -Force
        shell: pwsh

      - name: Zawartość katalogu dist
        run: dir dist
        shell: cmd

      - name: Artefakt kompilacji
        uses: actions/upload-artifact@v4
        with:
          name: CNC-Manager-windows
          path: |
            dist/CNC-Manager.exe
            dist/*.zip

      - name: Publikacja w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-exe
          name: CNC Manager — Windows (exe)
          body: |
            Przenośna aplikacja Windows — **jeden samodzielny plik**, bez instalacji.
            Działa z dowolnego miejsca: pulpitu, dysku, pendrive'a.

            - **CNC-Manager-windows.zip** — zalecane. Rozpakuj i uruchom `CNC-Manager.exe`.
              W środku jest dokładnie ten sam plik co niżej — spakowany, żeby pobieranie
              przechodziło bez fałszywego alarmu antywirusa.
            - **CNC-Manager.exe** — ten sam plik bez pakowania (przeglądarka może go zablokować).

            Pliki są nadpisywane najnowszą wersją przy każdej zmianie w aplikacji.

            ---

            **Przeglądarka lub antywirus zgłasza wirusa?** To fałszywy alarm.
            Aplikacja nie jest podpisana certyfikatem (podpis jest płatny), a plik `.exe`
            rozpakowuje się przy starcie do folderu tymczasowego — taki schemat bywa
            uznawany za podejrzany przez heurystykę, mimo że kod jest nieszkodliwy.
            W takiej sytuacji pobierz wersję **ZIP** — zwykle przechodzi bez ostrzeżeń.
            Cały kod źródłowy i przebieg budowania są jawne w tym repozytorium.
          files: |
            dist/CNC-Manager.exe
            dist/*.zip
