<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kreator folderów NC</title>
<style>
  :root {
    --bg1: #0f2027;
    --bg2: #203a43;
    --bg3: #2c5364;
    --accent1: #00c6ff;
    --accent2: #0072ff;
    --ok: #1e9e63;
    --err: #e0455a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }
  html { background: var(--bg2); }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3)) fixed;
    padding: 16px;
  }

  .app { width: 100%; max-width: 560px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 10px;
  }

  h1 {
    color: #eaf6ff;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
    text-transform: uppercase;
    opacity: 0.75;
  }

  .card {
    background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.35);
  }

  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

  button {
    padding: 9px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: translateY(1px); }

  #pickDir {
    color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    box-shadow: 0 3px 10px rgba(0, 114, 255, 0.35);
    white-space: nowrap;
  }
  #pickDir:hover { filter: brightness(1.08); }

  #dirName {
    color: #eaf6ff;
    font-size: 12px;
    opacity: 0.85;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #dirName b { color: var(--accent1); }

  #dropZone {
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 10px;
    padding: 34px 14px;
    text-align: center;
    color: rgba(234,246,255,0.55);
    font-size: 13px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #dropZone .big {
    display: block;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: transparent;
    background-image: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
  }
  #dropZone.armed { border-color: rgba(0,198,255,0.55); color: rgba(234,246,255,0.8); cursor: pointer; }
  #dropZone.over  { background: rgba(0,198,255,0.12); border-color: var(--accent1); }

  #unsupported { color: var(--err); font-size: 12px; margin: 10px 0 0; display: none; }

  #log {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 12.5px;
    color: #eaf6ff;
  }
  #log li { padding: 7px 2px; border-bottom: 1px solid rgba(255,255,255,0.10); }
  #log li:last-child { border-bottom: 0; }
  .ok::before   { content: "✓ "; color: var(--ok); font-weight: 700; }
  .err::before  { content: "✕ "; color: var(--err); font-weight: 700; }
  .warn { color: rgba(234,246,255,0.55); }
</style>
</head>
<body>

  <div class="app">
    <div class="topbar">
      <h1>Kreator folderów NC</h1>
    </div>

    <div class="card">
      <div class="row">
        <button id="pickDir">1&nbsp;·&nbsp;Wybierz folder docelowy</button>
        <span id="dirName"></span>
      </div>
      <div id="dropZone">
        <span class="big">2 · Przeciągnij tutaj plik .txt / .nc</span>
        Powstanie folder o nazwie z nawiasu w pierwszej linijce pliku,<br>
        a plik zostanie do niego skopiowany.
      </div>
      <p id="unsupported">Ta przeglądarka nie obsługuje zapisu na dysk — użyj Chrome lub Edge,
         albo aplikacji <b>KreatorFolderow.exe</b>.</p>
    </div>

    <div class="card">
      <ul id="log"><li class="warn">Brak operacji.</li></ul>
    </div>
  </div>

<script>
  const pickBtn = document.getElementById('pickDir');
  const dirName = document.getElementById('dirName');
  const zone = document.getElementById('dropZone');
  const log = document.getElementById('log');
  let parentDir = null;
  let firstEntry = true;

  if (!window.showDirectoryPicker) {
    document.getElementById('unsupported').style.display = 'block';
    pickBtn.disabled = true;
  }

  pickBtn.addEventListener('click', async () => {
    try {
      parentDir = await showDirectoryPicker({ mode: 'readwrite' });
      dirName.innerHTML = 'foldery powstaną w: <b></b>';
      dirName.querySelector('b').textContent = parentDir.name;
      zone.classList.add('armed');
    } catch (e) { /* anulowano */ }
  });

  function addLog(cls, text) {
    if (firstEntry) { log.innerHTML = ''; firstEntry = false; }
    const li = document.createElement('li');
    li.className = cls;
    li.textContent = text;
    log.prepend(li);
  }

  function extractName(text) {
    for (const line of text.split(/\r?\n/)) {
      const m = line.match(/\(([^)]+)\)/);
      if (m && m[1].trim()) return m[1].trim();
    }
    return null;
  }

  async function processFile(file) {
    if (!parentDir) { addLog('err', 'Najpierw wybierz folder docelowy.'); return; }
    const text = await file.text();
    let name = extractName(text);
    if (!name) {
      addLog('err', file.name + ' — nie znaleziono nazwy w nawiasie.');
      return;
    }
    name = name.replace(/[\\/:*?"<>|]/g, '_').replace(/[. ]+$/, '');
    try {
      let existed = true;
      try { await parentDir.getDirectoryHandle(name); }
      catch { existed = false; }
      const dir = await parentDir.getDirectoryHandle(name, { create: true });
      const fh = await dir.getFileHandle(file.name, { create: true });
      const w = await fh.createWritable();
      await w.write(await file.arrayBuffer());
      await w.close();
      if (existed) {
        addLog('ok', 'Folder „' + name + '” już istniał — skopiowano do niego plik ' + file.name + '.');
      } else {
        addLog('ok', 'Utworzono folder „' + name + '” i skopiowano plik ' + file.name + '.');
      }
    } catch (e) {
      addLog('err', 'Błąd przy folderze „' + name + '”: ' + e.message);
    }
  }

  zone.addEventListener('dragover', e => {
    e.preventDefault();
    if (parentDir) zone.classList.add('over');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', async e => {
    e.preventDefault();
    zone.classList.remove('over');
    for (const f of e.dataTransfer.files) await processFile(f);
  });
  zone.addEventListener('click', async () => {
    if (!parentDir || !window.showOpenFilePicker) return;
    try {
      const handles = await showOpenFilePicker({ multiple: true });
      for (const h of handles) await processFile(await h.getFile());
    } catch (e) { /* anulowano */ }
  });
</script>

</body>
</html>
