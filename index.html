<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Manager — HAAS ST-35Y</title>
<style>
  :root{
    --bg0:#06080f;
    --bg1:#0b1020;
    --card:rgba(255,255,255,.045);
    --card-hi:rgba(255,255,255,.08);
    --stroke:rgba(255,255,255,.09);
    --stroke-hi:rgba(255,255,255,.18);
    --txt:#e9edf7;
    --mut:#8d96ad;
    --ac1:#22d3ee;
    --ac2:#6366f1;
    --ac3:#a855f7;
    --ok:#34d399;
    --warn:#fbbf24;
    --err:#f87171;
    --grad:linear-gradient(135deg,#22d3ee,#6366f1 55%,#a855f7);
    --grad-soft:linear-gradient(135deg,rgba(34,211,238,.16),rgba(99,102,241,.16) 55%,rgba(168,85,247,.16));
    --radius:16px;
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#2a3350 transparent}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    background:var(--bg0);
    color:var(--txt);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ── tło z gradientowymi poświatami ─────────────────────────── */
  .bg{
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(900px 600px at 85% -10%,rgba(168,85,247,.22),transparent 60%),
      radial-gradient(800px 550px at -10% 20%,rgba(34,211,238,.16),transparent 60%),
      radial-gradient(700px 700px at 50% 110%,rgba(99,102,241,.20),transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
  }

  /* ── nagłówek ───────────────────────────────────────────────── */
  header{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(18px);
    background:rgba(8,11,22,.72);
    border-bottom:1px solid var(--stroke);
  }
  .header-in{
    max-width:1400px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:12px;user-select:none}
  .logo-mark{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:var(--grad);
    display:grid;place-items:center;
    box-shadow:0 4px 18px rgba(99,102,241,.45);
  }
  .logo-mark svg{width:24px;height:24px}
  .logo h1{
    font-size:1.25rem;font-weight:700;letter-spacing:.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  .machine{
    font-size:.68rem;font-weight:600;letter-spacing:.12em;color:var(--mut);
    border:1px solid var(--stroke);border-radius:999px;padding:4px 10px;
    background:rgba(255,255,255,.03);white-space:nowrap;
  }
  .search-wrap{flex:1;min-width:240px;position:relative}
  .search-wrap svg{
    position:absolute;left:14px;top:50%;translate:0 -50%;
    width:17px;height:17px;stroke:var(--mut);pointer-events:none;
  }
  #search{
    width:100%;padding:11px 40px 11px 42px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--stroke);border-radius:12px;
    color:var(--txt);font-size:.92rem;outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  #search::placeholder{color:#5d6780}
  #search:focus{
    border-color:var(--ac1);
    background:rgba(255,255,255,.07);
    box-shadow:0 0 0 3px rgba(34,211,238,.15),0 0 24px rgba(34,211,238,.12);
  }
  .search-clear{
    position:absolute;right:8px;top:50%;translate:0 -50%;
    width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;
    background:transparent;color:var(--mut);font-size:1rem;line-height:1;
    display:none;
  }
  .search-clear:hover{background:rgba(255,255,255,.08);color:var(--txt)}

  /* ── przyciski ──────────────────────────────────────────────── */
  .btn{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:12px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);color:var(--txt);
    font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .12s,box-shadow .2s,border-color .2s,background .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:var(--stroke-hi);background:rgba(255,255,255,.09)}
  .btn:active{transform:translateY(1px) scale(.96);box-shadow:0 0 0 3px rgba(255,255,255,.10)}
  .btn svg{width:17px;height:17px;flex:none}
  .btn-primary{
    background:var(--grad);border:none;color:#fff;
    box-shadow:0 4px 20px rgba(99,102,241,.40);
  }
  .btn-primary:hover{box-shadow:0 6px 28px rgba(99,102,241,.60);background:var(--grad)}
  .btn-primary:active{transform:translateY(1px) scale(.96);box-shadow:0 0 0 4px rgba(99,102,241,.30),0 0 30px rgba(168,85,247,.45)}
  .btn-danger{color:#fca5a5}
  .btn-danger:hover{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.10)}
  .btn-danger:active{box-shadow:0 0 0 3px rgba(248,113,113,.25)}
  .btn-sm{padding:8px 14px;font-size:.82rem;border-radius:10px}
  .btn .dot{width:8px;height:8px;border-radius:50%;flex:none;display:none}
  .btn.connected{border-color:rgba(52,211,153,.45)}
  .btn.connected .dot{display:block;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .btn.resume{border-color:rgba(251,191,36,.45)}
  .btn.resume .dot{display:block;background:var(--warn);box-shadow:0 0 8px var(--warn)}

  /* efekt fali po naciśnięciu */
  .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 65%);
    transform:scale(0);animation:ripple .6s ease-out forwards;
  }
  @keyframes ripple{to{transform:scale(1);opacity:0}}

  /* ── układ główny ───────────────────────────────────────────── */
  .layout{
    max-width:1400px;margin:0 auto;padding:26px 24px 60px;
    display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start;
  }
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  aside{position:sticky;top:86px;display:flex;flex-direction:column;gap:18px}
  @media(max-width:900px){aside{position:static}}
  .panel{
    background:var(--card);border:1px solid var(--stroke);
    border-radius:var(--radius);padding:16px;
  }
  .panel h3{
    font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut);margin-bottom:12px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    position:relative;overflow:hidden;
    padding:7px 14px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    color:var(--mut);font-size:.8rem;font-weight:600;font-family:inherit;
    transition:all .18s;-webkit-tap-highlight-color:transparent;
  }
  .chip:hover{color:var(--txt);border-color:var(--stroke-hi)}
  .chip:active{transform:scale(.94);box-shadow:0 0 0 3px rgba(34,211,238,.22)}
  .chip.on{
    background:var(--grad-soft);color:var(--txt);
    border-color:rgba(99,102,241,.55);
    box-shadow:0 0 16px rgba(99,102,241,.25) inset,0 0 12px rgba(99,102,241,.18);
  }
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:12px;padding:12px 10px;text-align:center;
  }
  .stat b{
    display:block;font-size:1.45rem;font-weight:800;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat span{font-size:.68rem;color:var(--mut);letter-spacing:.05em}
  .onums{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto}
  .onum{
    font-family:ui-monospace,Consolas,monospace;font-size:.72rem;
    padding:3px 8px;border-radius:7px;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--mut);
  }
  .onum.dup{color:var(--err);border-color:rgba(248,113,113,.5)}

  /* ── siatka kart ────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{
    position:relative;overflow:hidden;cursor:pointer;
    background:var(--card);border:1px solid var(--stroke);
    border-radius:var(--radius);padding:18px;
    transition:transform .18s,border-color .2s,box-shadow .25s,background .2s;
    animation:fadeUp .35s ease both;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:var(--grad);opacity:0;transition:opacity .25s;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(99,102,241,.45);
    box-shadow:0 14px 38px rgba(0,0,0,.45),0 0 26px rgba(99,102,241,.14);
    background:var(--card-hi);
  }
  .card:hover::before{opacity:1}
  .card:active{
    transform:translateY(0) scale(.985);
    box-shadow:0 0 0 3px rgba(99,102,241,.35),0 0 34px rgba(168,85,247,.30);
  }
  .card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
  .card h2{font-size:1.02rem;font-weight:700;line-height:1.3;flex:1;word-break:break-word}
  .badge-o{
    font-family:ui-monospace,Consolas,monospace;font-size:.72rem;font-weight:700;
    padding:4px 9px;border-radius:8px;flex:none;
    background:var(--grad-soft);border:1px solid rgba(99,102,241,.4);color:#c7d2fe;
  }
  .fav-btn{
    flex:none;width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;
    background:transparent;display:grid;place-items:center;
    transition:transform .15s,background .2s;
  }
  .fav-btn:hover{background:rgba(251,191,36,.12)}
  .fav-btn:active{transform:scale(.8)}
  .fav-btn svg{width:17px;height:17px;fill:none;stroke:#5d6780;stroke-width:2;transition:all .2s}
  .fav-btn.on svg{fill:var(--warn);stroke:var(--warn);filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
  .dir-btn{
    flex:none;width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;
    background:transparent;display:grid;place-items:center;
    transition:transform .15s,background .2s;
  }
  .dir-btn:hover{background:rgba(34,211,238,.12)}
  .dir-btn:active{transform:scale(.8);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
  .dir-btn svg{width:17px;height:17px;fill:none;stroke:#5d6780;stroke-width:2;transition:stroke .2s}
  .dir-btn:hover svg{stroke:var(--ac1)}
  .card-sub{font-size:.83rem;color:var(--mut);margin-bottom:12px;line-height:1.45}
  .card-sub b{color:#b9c2d8;font-weight:600}
  .card-mid{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
  .card-mid .card-sub{flex:1;margin-bottom:0}
  .thumb{
    width:110px;min-height:78px;flex:none;border-radius:10px;overflow:hidden;
    border:1px solid var(--stroke);background:rgba(255,255,255,.05);
    display:grid;place-items:center;
    transition:transform .15s,box-shadow .2s,border-color .2s;
  }
  .thumb.has{background:#fff;border-color:rgba(255,255,255,.25)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb:hover{border-color:var(--ac1);box-shadow:0 0 18px rgba(34,211,238,.30);transform:scale(1.05)}
  .thumb svg{width:22px;height:22px;stroke:#39415c}
  .thumb-add{
    border-style:dashed;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:transparent;color:#5d6780;font-family:inherit;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;
  }
  .thumb-add svg{width:18px;height:18px;stroke:#5d6780;transition:stroke .2s}
  .thumb-add:hover{color:var(--ac1)}
  .thumb-add:hover svg{stroke:var(--ac1)}
  .thumb-add:active{transform:scale(.94);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{
    font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:999px;
    background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.28);color:#7dd3fc;
  }
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    font-size:.72rem;color:#5d6780;
    border-top:1px solid var(--stroke);padding-top:11px;
  }
  .card-foot .ver{display:inline-flex;align-items:center;gap:5px}
  .card-foot svg{width:13px;height:13px;stroke:#5d6780}

  .empty{
    grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--mut);
    border:1px dashed var(--stroke);border-radius:var(--radius);
  }
  .empty svg{width:52px;height:52px;stroke:#39415c;margin-bottom:14px}
  .empty p{font-size:.95rem}

  /* ── modale ─────────────────────────────────────────────────── */
  .modal{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:flex-start;justify-content:center;
    padding:4vh 16px;overflow:auto;
    background:rgba(4,6,12,.72);backdrop-filter:blur(8px);
  }
  .modal.open{display:flex}
  .dialog{
    width:100%;max-width:860px;
    background:linear-gradient(180deg,#111730,#0c1120 40%);
    border:1px solid var(--stroke-hi);border-radius:20px;
    box-shadow:var(--shadow),0 0 60px rgba(99,102,241,.15);
    animation:pop .22s cubic-bezier(.3,1.4,.5,1) both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
  .dialog-head{
    display:flex;align-items:center;gap:12px;
    padding:20px 24px;border-bottom:1px solid var(--stroke);
  }
  .dialog-head h2{font-size:1.1rem;font-weight:700;flex:1}
  .x-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.04);color:var(--mut);cursor:pointer;
    font-size:1.05rem;line-height:1;transition:all .15s;
  }
  .x-btn:hover{color:var(--txt);border-color:var(--stroke-hi)}
  .x-btn:active{transform:scale(.88);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .dialog-body{padding:22px 24px}
  .dialog-foot{
    display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;
    padding:16px 24px;border-top:1px solid var(--stroke);
  }

  /* formularz */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.fgrid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.wide{grid-column:1/-1}
  .field label{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
  .field input,.field textarea{
    padding:10px 13px;border-radius:11px;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    color:var(--txt);font-size:.9rem;font-family:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .field textarea{resize:vertical;min-height:60px}
  .field textarea.code-in{
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.84rem;min-height:260px;line-height:1.55;
    background:rgba(0,0,0,.35);white-space:pre;
  }
  .field input:focus,.field textarea:focus{
    border-color:var(--ac2);
    box-shadow:0 0 0 3px rgba(99,102,241,.18),0 0 20px rgba(99,102,241,.12);
  }
  .field input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
  .field .hint{font-size:.73rem;color:var(--err);display:none}
  .field .hint.show{display:block}
  .field-row{display:flex;gap:8px}
  .field-row input{flex:1;min-width:0}
  .mini-btn{
    position:relative;overflow:hidden;flex:none;
    padding:0 13px;border-radius:11px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);color:var(--mut);
    font-size:.76rem;font-weight:700;font-family:inherit;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .mini-btn:hover{color:var(--txt);border-color:var(--stroke-hi)}
  .mini-btn:active{transform:scale(.94);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
  .field textarea.code-in.hot{
    border-color:var(--ac1);
    background:rgba(34,211,238,.07);
    box-shadow:0 0 0 3px rgba(34,211,238,.28),0 0 34px rgba(34,211,238,.22);
  }
  .pdf-box{display:flex;flex-direction:column;gap:8px}
  .pdf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pdf-row .mini-btn{padding:9px 14px}
  .pdf-note{font-size:.76rem;color:var(--mut)}
  .pdf-have{font-size:.8rem;color:#6ee7a0}
  .pdf-item{
    position:relative;overflow:hidden;cursor:pointer;
    padding:9px 13px;border-radius:10px;font-size:.83rem;color:#b9c2d8;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);
    transition:all .15s;word-break:break-all;
  }
  .pdf-item:hover{border-color:var(--stroke-hi)}
  .pdf-item:active{transform:scale(.985);box-shadow:0 0 0 3px rgba(52,211,153,.25)}
  .pdf-item.on{
    border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.08);color:#d1fae5;
    box-shadow:0 0 14px rgba(52,211,153,.18);
  }
  .pdf-item b{color:var(--ok);font-weight:600}

  /* podgląd programu */
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .meta{
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:11px;padding:10px 12px;
  }
  .meta span{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5d6780;margin-bottom:3px}
  .meta b{font-size:.87rem;font-weight:600;word-break:break-word}
  .sect{margin-top:20px}
  .sect>h3{
    font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .sect>h3::after{content:"";flex:1;height:1px;background:var(--stroke)}
  pre.code{
    background:rgba(0,0,0,.42);border:1px solid var(--stroke);border-radius:13px;
    padding:16px 18px;overflow:auto;max-height:420px;
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.83rem;line-height:1.6;color:#cdd6ea;
  }
  .tk-com{color:#6ee7a0;font-style:italic}
  .tk-g{color:#67e8f9;font-weight:600}
  .tk-m{color:#f0abfc;font-weight:600}
  .tk-n{color:#818cf8}
  .tk-t{color:#fbbf24;font-weight:700}
  .tk-f{color:#fda4af}
  .tk-x{color:#e9edf7}
  .tk-pct{color:#5d6780}
  .tools{display:flex;flex-direction:column;gap:7px}
  .tool{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:10px;padding:9px 13px;font-size:.85rem;
  }
  .tool .tno{
    font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--warn);
    background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);
    border-radius:7px;padding:3px 9px;flex:none;
  }
  .tool .tdesc{color:#b9c2d8}
  .vers{display:flex;flex-direction:column;gap:8px}
  .ver-item{
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:11px;overflow:hidden;
  }
  .ver-item summary{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 14px;cursor:pointer;list-style:none;font-size:.85rem;
    transition:background .15s;
  }
  .ver-item summary::-webkit-details-marker{display:none}
  .ver-item summary:hover{background:rgba(255,255,255,.04)}
  .ver-item summary:active{background:rgba(99,102,241,.14)}
  .ver-date{font-weight:600;color:#b9c2d8}
  .ver-note{color:var(--mut);flex:1}
  .ver-body{padding:0 14px 14px}

  /* powiadomienia */
  #toast{
    position:fixed;bottom:26px;left:50%;translate:-50% 0;z-index:200;
    display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;
  }
  .toast{
    padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:600;

<script>
"use strict";
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";
/* ════════════════════ dane ════════════════════ */
const LS_KEY = "cncPrograms_v1";
let programs = [];
let query = "";
let filter = "all";      // all | fav | tag:xxx
let editId = null;       // id edytowanego programu (null = nowy)
let viewId = null;       // id programu w podglądzie

function load() {
  try { programs = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
  catch (e) { programs = []; }
  // usunięcie przykładowych programów zapisanych przez wcześniejsze wersje aplikacji
  const demo = { p1: "O00125", p2: "O00210", p3: "O00305" };
  const before = programs.length;
  programs = programs.filter(p => demo[p.id] !== p.onum);
  if (programs.length !== before) save();
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(programs)); }
const byId = id => programs.find(p => p.id === id);
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ════════════════════ analiza G-kodu ════════════════════ */
const onumInt = s => { const m = String(s || "").match(/\d+/); return m ? parseInt(m[0], 10) : NaN; };
const collapse = s => String(s || "").replace(/\s+/g, " ").trim();
function sanitizeName(s) {
  let base = collapse(String(s || "").replace(/[\\/:*?"<>|]+/g, "_")).slice(0, 60).replace(/[. ]+$/, "");
  if (!base || /^(CON|PRN|AUX|NUL|COM\d|LPT\d)$/i.test(base)) base = "program_" + base;
  return base;
}

/* wyciąga z kodu: numer O, nazwę z nawiasów obok numeru, nazwę detalu, numer rysunku SZ#### */
function parseGcodeMeta(code) {
  const meta = { onum: "", name: "", detail: "", drawing: "" };
  const m = String(code || "").match(/^[ \t]*[Oo](\d{1,5})[ \t]*(?:\(([^)]*)\))?/m);
  if (m) { meta.onum = "O" + m[1]; meta.name = collapse(m[2]); }
  const dm = String(code || "").slice(0, 800).match(/\bSZ[-\s]?(\d{2,6})\b/i);
  if (dm) meta.drawing = "SZ" + dm[1];
  for (const line of String(code || "").split("\n").slice(0, 15)) {
    const c = line.match(/^\s*\(([^)]*)\)\s*$/);
    if (!c) continue;
    const t = collapse(c[1]);
    if (!t || /^[*\-=_. ]+$/.test(t) || t.startsWith("---")) continue;
    if (/\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}/.test(t)) continue;
    if (meta.name && t.toLowerCase() === meta.name.toLowerCase()) continue;
    meta.detail = t;
    break;
  }
  return meta;
}

function replaceOnumInCode(code, onum) {
  if (!onum) return code;
  const num = String(onum).replace(/^[Oo]/, "");
  if (/^[ \t]*[Oo]\d+/m.test(code)) return code.replace(/^([ \t]*)[Oo]\d+/m, "$1O" + num);
  return code;
}

/* pierwszy wolny numer O — najmniejszy, którego nie ma w bibliotece */
function nextFreeOnum() {
  const used = new Set(programs.map(p => onumInt(p.onum)).filter(n => !isNaN(n) && n > 0));
  let n = 1;
  while (used.has(n)) n++;
  return "O" + String(n).padStart(4, "0");
}

/* ════════════════ folder CNC Programy na dysku (File System Access API) ════════════════ */
let fsRoot = null;
let pdfRoot = null;         // folder z rysunkami PDF
let pdfFiles = [];          // zeskanowana lista PDF-ów: {name, path, handle}
let pdfCandidates = [];     // wyniki wyszukiwania rysunku w formularzu
let selectedPdf = null;     // rysunek wybrany do skopiowania przy zapisie
let attachedPdfs = [];      // rysunki już leżące w folderze edytowanego programu
const FILE_RE = /\.(txt|nc|cnc|tap|eia|prg|ngc)$/i;

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("cncFS", 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if (!db.objectStoreNames.contains("thumbs")) db.createObjectStore("thumbs");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v, store = "kv") {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, "readwrite");
    t.objectStore(store).put(v, k);
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
  });
}
async function idbGet(k, store = "kv") {
  const db = await idb();
  return new Promise((res, rej) => {
    const g = db.transaction(store, "readonly").objectStore(store).get(k);
    g.onsuccess = () => res(g.result);
    g.onerror = () => rej(g.error);
  });
}

function updateFolderUI(resume) {
  const btn = document.getElementById("btnFolder");
  const lbl = document.getElementById("folderLabel");
  const off = document.getElementById("btnFolderOff");
  btn.classList.remove("connected", "resume");
  if (!fsRoot) {
    lbl.textContent = "Połącz folder";
    btn.title = "Połącz z folderem CNC Programy na dysku";
    off.style.display = "none";
    return;
  }
  off.style.display = "";
  if (resume) {
    btn.classList.add("resume");
    lbl.textContent = "Wznów: " + fsRoot.name;
    btn.title = "Kliknij, aby przywrócić dostęp do folderu";
  } else {
    btn.classList.add("connected");
    lbl.textContent = fsRoot.name;
    btn.title = "Kliknij, aby przeskanować folder ponownie";
  }
}

async function connectFolder() {
  if (window.native) {
    const r = await window.native.pickFolder("Wybierz folder główny z programami CNC");
    if (!r) return;
    fsRoot = { native: true, path: r.path, name: r.name };
    localStorage.setItem("cncRootPath", JSON.stringify(r));
    updateFolderUI(false);
    await rescanFolder();
    return;
  }
  if (!window.showDirectoryPicker) {
    toast("Ta przeglądarka nie obsługuje dostępu do folderów — użyj Chrome lub Edge");
    return;
  }
  try { fsRoot = await window.showDirectoryPicker({ mode: "readwrite" }); }
  catch (e) { return; }
  try { await idbSet("root", fsRoot); } catch (e) {}
  updateFolderUI(false);
  await rescanFolder();
}

async function restoreFolder() {
  if (window.native) {
    try {
      const r = JSON.parse(localStorage.getItem("cncRootPath") || "null");
      if (r && await window.native.exists(r.path)) {
        fsRoot = { native: true, path: r.path, name: r.name };
        updateFolderUI(false);
        await rescanFolder();
      }
    } catch (e) {}
    try {
      const r2 = JSON.parse(localStorage.getItem("cncPdfPath") || "null");
      if (r2 && await window.native.exists(r2.path)) {
        pdfRoot = { native: true, path: r2.path, name: r2.name };
        updatePdfUI(false);
        await scanPdfFolder();
      }
    } catch (e) {}
    return;
  }
  if (!window.showDirectoryPicker) return;
  let h = null;
  try { h = await idbGet("root"); } catch (e) {}
  if (h) {
    fsRoot = h;
    let st = "prompt";
    try { st = await h.queryPermission({ mode: "readwrite" }); } catch (e) {}
    updateFolderUI(st !== "granted");
    if (st === "granted") await rescanFolder();
    else toast('Kliknij "Wznów: ' + h.name + '", aby przywrócić dostęp do folderu');
  }
  let hp = null;
  try { hp = await idbGet("pdfRoot"); } catch (e) {}
  if (hp) {
    pdfRoot = hp;
    let st = "prompt";
    try { st = await hp.queryPermission({ mode: "read" }); } catch (e) {}
    updatePdfUI(st !== "granted");
    if (st === "granted") await scanPdfFolder();
  }
}

async function disconnectFolder() {
  fsRoot = null;
  localStorage.removeItem("cncRootPath");

/* skanuje folder główny: podfoldery z plikami programów + pliki luzem */
async function rescanFolder() {
  if (!fsRoot) return;
  let found = [];
  if (fsRoot.native) {
    try { found = await window.native.scanPrograms(fsRoot.path); }
    catch (e) { toast("Nie udało się odczytać folderu"); return; }
    mergeScan(found);
    return;
  }
  try {
    for await (const [name, h] of fsRoot.entries()) {
      if (h.kind === "directory") {
        const progs = [], pdfs = [];
        try {
          for await (const [fn, fh] of h.entries()) {
            if (fh.kind !== "file") continue;
            if (FILE_RE.test(fn)) {
              const f = await fh.getFile();
              progs.push({ dir: name, file: fn, code: await f.text(), mtime: f.lastModified });
            } else if (/\.pdf$/i.test(fn)) {
              pdfs.push(fn);
            }
          }
        } catch (e) {}
        progs.forEach(pr => { pr.pdfs = pdfs; found.push(pr); });
      } else if (h.kind === "file" && FILE_RE.test(name)) {
        const f = await h.getFile();
        found.push({ dir: "", file: name, code: await f.text(), mtime: f.lastModified, pdfs: [] });
      }
    }
  } catch (e) { toast("Nie udało się odczytać folderu"); return; }
  mergeScan(found);
}

/* scala wynik skanowania z biblioteką (wspólne dla trybu natywnego i przeglądarki) */
function mergeScan(found) {
  const diskIds = new Set();
  let added = 0;
  found.forEach(x => {
    const id = "d:" + (x.dir ? x.dir + "/" : "") + x.file;
    diskIds.add(id);
    const p = byId(id);
    if (!p) {
      const meta = parseGcodeMeta(x.code);
      programs.push({
        id, source: "disk", dir: x.dir, file: x.file,
        name: meta.name || x.file.replace(/\.[^.]+$/, ""),
        onum: meta.onum || "", detail: meta.detail || "",
        drawing: meta.drawing || "", client: "", material: "", tags: [], note: "",
        fav: false, versions: [], code: x.code, created: x.mtime, modified: x.mtime,
        pdfs: x.pdfs || []
      });
      added++;
    } else {
      p.pdfs = x.pdfs || [];
      if (p.code !== x.code) {
        (p.versions = p.versions || []).push({ date: p.modified, note: "Wersja sprzed zmiany pliku na dysku", code: p.code });
        p.code = x.code;
        p.modified = x.mtime;
        const meta = parseGcodeMeta(x.code);
        if (meta.onum) p.onum = meta.onum;
        if (meta.drawing && !p.drawing) p.drawing = meta.drawing;
      }
    }
  });
  programs = programs.filter(p => p.source !== "disk" || diskIds.has(p.id));
  save();
  render();
  toast("Folder „" + fsRoot.name + "”: " + found.length + " plików" + (added ? ", nowych: " + added : ""));
}

let fsLastError = "";
async function writeDisk(p) {
  if (!fsRoot || !p.file) { fsLastError = "folder nie jest połączony"; return false; }
  fsLastError = "";
  if (fsRoot.native) {
    const r = await window.native.writeProgram(fsRoot.path, p.dir || "", p.file, p.code || "")
      .catch(e => ({ ok: false, error: String(e) }));
    if (r && r.ok) return true;
    fsLastError = (r && r.error) || "błąd zapisu";
    return false;
  }
  try {
    let st = "granted";
    try {
      st = await fsRoot.queryPermission({ mode: "readwrite" });
      if (st !== "granted") st = await fsRoot.requestPermission({ mode: "readwrite" });
    } catch (e) {}
    if (st !== "granted") { fsLastError = "brak zgody na zapis w folderze"; return false; }
    const dh = p.dir ? await fsRoot.getDirectoryHandle(p.dir, { create: true }) : fsRoot;
    const fh = await dh.getFileHandle(p.file, { create: true });
    const w = await fh.createWritable();
    await w.write(p.code || "");
    await w.close();
    return true;
  } catch (e) {
    fsLastError = (e && e.name ? e.name + ": " : "") + ((e && e.message) || e);
    return false;
  }
}

/* skanuje folder rysunków (z podfolderami) i zapamiętuje listę PDF-ów */
async function scanPdfFolder() {
  if (!pdfRoot) return;
  pdfFiles = [];
  if (pdfRoot.native) {
    try {
      const list = await window.native.scanPdfs(pdfRoot.path);
      pdfFiles = list.map(x => ({ name: x.name, path: x.rel, abs: x.abs }));
    } catch (e) {}
  } else {
    async function walk(dir, path, depth) {
      if (depth > 4) return;
      try {
        for await (const [name, h] of dir.entries()) {
          if (h.kind === "file" && /\.pdf$/i.test(name)) {
            pdfFiles.push({ name, path: (path ? path + "/" : "") + name, handle: h });
          } else if (h.kind === "directory") {
            await walk(h, (path ? path + "/" : "") + name, depth + 1);
          }
        }
      } catch (e) {}
    }
    await walk(pdfRoot, "", 0);
  }
  toast("Folder rysunków „" + pdfRoot.name + "”: " + pdfFiles.length + " plików PDF");
}

/* szuka rysunku po numerze (SZ2456) i po nazwie z nawiasów obok numeru O */
function findPdfMatches(drawing, name) {
  const norm = s => String(s || "").toLowerCase().replace(/[\s\-_]+/g, "");
  const dn = norm(drawing);
  const tokens = String(name || "").toLowerCase().split(/\s+/)
    .filter(t => t.length >= 3 && !/^\d+$/.test(t) && norm(t) !== dn);
  const out = [];
  for (const f of pdfFiles) {
    const fn = norm(f.name.replace(/\.pdf$/i, ""));
    let score = 0;
    if (dn && fn.includes(dn)) score += 10;
    for (const t of tokens) if (fn.includes(norm(t))) score += 1;
    if (score > 0) out.push({ f, score });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 8).map(x => x.f);
}

const thumbCache = new Map();
let thumbRun = 0;
let pdfObjUrl = null;

/* renderuje pierwszą stronę PDF do małego obrazka */
async function makeThumb(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await pdf.getPage(1);
  const v0 = page.getViewport({ scale: 1 });
  const scale = Math.max(240 / v0.width, 170 / v0.height);
  const vp = page.getViewport({ scale });
  const c = document.createElement("canvas");
  c.width = Math.ceil(vp.width);
  c.height = Math.ceil(vp.height);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const url = c.toDataURL("image/jpeg", 0.82);
  pdf.destroy();
  return url;
}

async function pdfFileOf(p) {
  if (!fsRoot || !p.dir || !(p.pdfs && p.pdfs.length)) return null;
  if (fsRoot.native) {
    try {
      const r = await window.native.readFile(fsRoot.path + "/" + p.dir + "/" + p.pdfs[0]);
      if (!(r && r.ok)) return null;
      return new File([r.data], p.pdfs[0], { type: "application/pdf", lastModified: Math.round(r.mtime) });
    } catch (e) { return null; }
  }
  try {
    const dh = await fsRoot.getDirectoryHandle(p.dir);
    const fh = await dh.getFileHandle(p.pdfs[0]);
    return await fh.getFile();
  } catch (e) { return null; }
}

/* uzupełnia miniaturki na widocznych kartach (z pamięcią podręczną w IndexedDB) */
async function loadThumbs() {
  if (!window.pdfjsLib || !fsRoot) return;
  const run = ++thumbRun;
  for (const el of [...document.querySelectorAll("[data-pdfthumb]")]) {
    if (run !== thumbRun) return;
    const p = byId(el.dataset.pdfthumb);
    if (!p) continue;
    const f = await pdfFileOf(p);
    if (!f) continue;
    const key = p.dir + "/" + p.pdfs[0] + ":" + f.lastModified;
    let url = thumbCache.get(key);
    if (!url) { try { url = await idbGet(key, "thumbs"); } catch (e) {} }
    if (!url) {
      try { url = await makeThumb(f); } catch (e) { continue; }
      idbSet(key, url, "thumbs").catch(() => {});
    }
    thumbCache.set(key, url);
    if (run !== thumbRun) return;
    el.innerHTML = '<img src="' + url + '" alt="">';
    el.classList.add("has");
  }
}

async function copyPdfToProgram(p, entry) {
  if (!fsRoot || !p.dir || !entry) return false;

    const r = await window.native.copyFile(entry.abs, fsRoot.path, p.dir, entry.name)
      .catch(() => ({ ok: false }));
    if (!(r && r.ok)) return false;
    p.pdfs = [...new Set([...(p.pdfs || []), entry.name])];
    return true;
  }
  try {
    const src = await entry.handle.getFile();
    const dh = await fsRoot.getDirectoryHandle(p.dir, { create: true });
    const fh = await dh.getFileHandle(entry.name, { create: true });
    const w = await fh.createWritable();
    await w.write(await src.arrayBuffer());
    await w.close();
    p.pdfs = [...new Set([...(p.pdfs || []), entry.name])];
    return true;
  } catch (e) { return false; }
}

/* import wielu plików naraz — od razu do biblioteki (i na dysk, gdy folder połączony) */
async function importFile(file) {
  let text = "";
  try { text = await file.text(); } catch (e) { return; }
  const meta = parseGcodeMeta(text);
  let onum = meta.onum;
  const n = onumInt(onum);
  if (!onum || programs.some(p => onumInt(p.onum) === n)) onum = nextFreeOnum();
  const code = replaceOnumInCode(text, onum);
  const name = meta.name || file.name.replace(/\.[^.]+$/, "");
  const p = {
    id: uid(), source: "local", fav: false, versions: [],
    created: Date.now(), modified: Date.now(),
    name, onum, detail: meta.detail || "",
    drawing: meta.drawing || "", client: "", material: "", tags: [], note: "", code
  };
  if (fsRoot) {
    let base = sanitizeName(name);
    if (byId("d:" + base + "/" + base + ".txt")) base = base + "_" + onum;
    p.dir = base; p.file = base + ".txt"; p.id = "d:" + base + "/" + p.file; p.source = "disk";
    await writeDisk(p);
    if (pdfRoot) {
      const match = findPdfMatches(p.drawing, p.name)[0];
      if (match) await copyPdfToProgram(p, match);
    }
  }
  programs.push(p);
}

/* ════════════════════ narzędzia ════════════════════ */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmtDate = t => new Date(t).toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" }) +
  " " + new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });

function hlCode(code) {
  return esc(code).replace(/\([^)\n]*\)?|[A-Za-z][+-]?\d+\.?\d*|%/g, tok => {
    if (tok[0] === "(") return '<span class="tk-com">' + tok + "</span>";
    if (tok === "%") return '<span class="tk-pct">%</span>';
    const L = tok[0].toUpperCase();
    if (L === "G") return '<span class="tk-g">' + tok + "</span>";
    if (L === "M") return '<span class="tk-m">' + tok + "</span>";
    if (L === "O" || L === "N") return '<span class="tk-n">' + tok + "</span>";
    if (L === "T") return '<span class="tk-t">' + tok + "</span>";
    if (L === "S" || L === "F") return '<span class="tk-f">' + tok + "</span>";
    return '<span class="tk-x">' + tok + "</span>";
  });
}

function extractTools(code) {
  const map = new Map();
  (code || "").split("\n").forEach(line => {
    const m = line.match(/(?:^|[^A-Za-z(])T(\d{2,4})/);
    if (m) {
      const key = "T" + m[1];
      const com = (line.match(/\(([^)]*)\)/) || [])[1] || "";
      if (!map.has(key) || com) map.set(key, com.trim());
    }
  });
  return [...map.entries()];
}

function extractOffsets(code) {
  return [...new Set((code || "").match(/G5[4-9]|G154\s*P\d+/g) || [])];
}

function toast(msg) {
  const box = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, 2400);
}

          ${(p.pdfs && p.pdfs.length) ? `<div class="thumb" data-pdfthumb="${p.id}" title="${esc(p.pdfs[0])} — kliknij, aby powiększyć">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"></path>
            </svg>
          </div>` : (p.dir ? `<button class="thumb thumb-add" data-addpdf="${p.id}" title="Znajdź i dodaj rysunek PDF do tego programu">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            Dodaj PDF
          </button>` : "")}
        </div>
        ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="card-foot">
          <span>${p.dir ? "📁 " + esc(p.dir) + " · " : ""}${fmtDate(p.modified)}${(p.pdfs && p.pdfs.length) ? " · 📄" : ""}</span>
          <span class="ver">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
              <path d="M12 8v4l2.5 2.5"></path><circle cx="12" cy="12" r="9"></circle>
            </svg>
            ${(p.versions || []).length + 1} wer.
          </span>
        </div>
      </article>`).join("");
  }

  renderSidebar();
  setTimeout(loadThumbs, 30);
}

function renderSidebar() {
  // filtry
  const allTags = [...new Set(programs.flatMap(p => p.tags || []))].sort((a, b) => a.localeCompare(b, "pl"));
  const chips = [
    { key: "all", label: "Wszystkie" },
    { key: "fav", label: "★ Ulubione" },
    ...allTags.map(t => ({ key: "tag:" + t, label: t }))
  ];
  document.getElementById("filters").innerHTML = chips.map(c =>
    `<button class="chip ${filter === c.key ? "on" : ""}" data-filter="${esc(c.key)}">${esc(c.label)}</button>`).join("");

  // statystyki
  document.getElementById("stProg").textContent = programs.length;
  document.getElementById("stVer").textContent = programs.reduce((s, p) => s + (p.versions || []).length + 1, 0);
  document.getElementById("stFav").textContent = programs.filter(p => p.fav).length;
  document.getElementById("stCli").textContent = new Set(programs.map(p => (p.client || "").trim().toLowerCase()).filter(Boolean)).size;

  // numery O
  const counts = {};
  programs.forEach(p => { if (p.onum) counts[p.onum] = (counts[p.onum] || 0) + 1; });
  const nums = Object.keys(counts).sort();
  document.getElementById("onums").innerHTML = nums.length
    ? nums.map(n => `<span class="onum ${counts[n] > 1 ? "dup" : ""}" ${counts[n] > 1 ? 'title="Numer zdublowany!"' : ""}>${esc(n)}</span>`).join("")
    : '<span style="font-size:.78rem;color:#5d6780">Brak przypisanych numerów</span>';
}

/* ════════════════════ podgląd programu ════════════════════ */
function openView(id) {
  const p = byId(id); if (!p) return;
  viewId = id;
  document.getElementById("vTitle").textContent = p.name;
  const ob = document.getElementById("vOnum");
  ob.textContent = p.onum || "";
  ob.style.display = p.onum ? "" : "none";

  const tools = extractTools(p.code);
  const offsets = extractOffsets(p.code);
  const meta = [
    ["Detal", p.detail], ["Nr rysunku", p.drawing], ["Klient", p.client],
    ["Materiał", p.material], ["Utworzono", fmtDate(p.created)], ["Zmieniono", fmtDate(p.modified)],
    ["Plik na dysku", p.file ? (p.dir ? p.dir + "/" : "") + p.file : ""],
    ["Rysunek PDF", (p.pdfs || []).join(", ")]
  ].filter(m => m[1]);

  document.getElementById("vBody").innerHTML = `
    <div class="meta-grid">
      ${meta.map(m => `<div class="meta"><span>${m[0]}</span><b>${esc(m[1])}</b></div>`).join("")}
      ${offsets.length ? `<div class="meta"><span>Bazy</span><b>${offsets.map(esc).join(", ")}</b></div>` : ""}
    </div>
    ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${p.note ? `<div class="sect"><h3>Notatka</h3><div style="font-size:.88rem;color:#b9c2d8;line-height:1.55">${esc(p.note)}</div></div>` : ""}
    <div class="sect"><h3>Kod programu</h3><pre class="code">${hlCode(p.code || "")}</pre></div>
    ${tools.length ? `<div class="sect"><h3>Narzędzia w programie</h3>
      <div class="tools">${tools.map(([t, d]) =>
        `<div class="tool"><span class="tno">${esc(t)}</span><span class="tdesc">${esc(d) || "—"}</span></div>`).join("")}</div></div>` : ""}
    <div class="sect"><h3>Historia wersji</h3>
      ${(p.versions || []).length ? `<div class="vers">${p.versions.slice().reverse().map((v, ri) => {
        const idx = p.versions.length - 1 - ri;
        return `<details class="ver-item">
          <summary>
            <span class="ver-date">${fmtDate(v.date)}</span>
            <span class="ver-note">${esc(v.note || "bez opisu")}</span>
            <button class="btn btn-sm" data-restore="${idx}">Przywróć</button>
          </summary>
          <div class="ver-body"><pre class="code">${hlCode(v.code || "")}</pre></div>
        </details>`;
      }).join("")}</div>`
      : '<div style="font-size:.83rem;color:#5d6780">Ten program ma tylko wersję bieżącą.</div>'}
    </div>`;

  openModal("mView");
}

/* ════════════════════ formularz ════════════════════ */
function openEdit(id) {
  editId = id || null;
  const p = id ? byId(id) : null;
  document.getElementById("mEditTitle").textContent = p ? "Edycja: " + p.name : "Nowy program";
  document.getElementById("fName").value = p ? p.name : "";
  document.getElementById("fOnum").value = p ? p.onum || "" : "";
  document.getElementById("fDetail").value = p ? p.detail || "" : "";
  document.getElementById("fDrawing").value = p ? p.drawing || "" : "";
  document.getElementById("fClient").value = p ? p.client || "" : "";
  document.getElementById("fMaterial").value = p ? p.material || "" : "";
  document.getElementById("fTags").value = p ? (p.tags || []).join(", ") : "";
  document.getElementById("fNote").value = p ? p.note || "" : "";
  document.getElementById("fCode").value = p ? p.code || "" : "";
  document.getElementById("fChange").value = "";
  document.getElementById("fChangeWrap").style.display = p ? "" : "none";
  document.getElementById("fName").classList.remove("bad");
  document.getElementById("fOnum").classList.remove("bad");
  document.getElementById("hName").classList.remove("show");
  document.getElementById("hOnum").classList.remove("show");
  selectedPdf = null;
  pdfCandidates = [];
  attachedPdfs = (p && p.pdfs) ? p.pdfs.slice() : [];
  if (pdfRoot && p && (p.drawing || p.name) && !attachedPdfs.length) doPdfSearch(true);
  else renderPdfBox();
  openModal("mEdit");
  setTimeout(() => document.getElementById("fName").focus(), 60);
}

function checkOnumDup() {
  const n = onumInt(document.getElementById("fOnum").value);
  const dup = !isNaN(n) && programs.some(p => p.id !== editId && onumInt(p.onum) === n);
  document.getElementById("fOnum").classList.toggle("bad", dup);
  document.getElementById("hOnum").classList.toggle("show", dup);
  return dup;
}

async function saveProgram() {
  const name = document.getElementById("fName").value.trim();
  if (!name) {
    document.getElementById("fName").classList.add("bad");
    document.getElementById("hName").classList.add("show");
    document.getElementById("fName").focus();
    return;
  }
  let onum = document.getElementById("fOnum").value.trim().toUpperCase();
  let code = document.getElementById("fCode").value;
  if (!onum) {
    const m = parseGcodeMeta(code);
    if (m.onum) onum = m.onum;
  }
  if (onum) code = replaceOnumInCode(code, onum);
  const data = {
    name,
    onum,
    detail: document.getElementById("fDetail").value.trim(),
    drawing: document.getElementById("fDrawing").value.trim(),
    client: document.getElementById("fClient").value.trim(),
    material: document.getElementById("fMaterial").value.trim(),
    tags: document.getElementById("fTags").value.split(",").map(t => t.trim()).filter(Boolean),
    note: document.getElementById("fNote").value.trim(),
    code
  };

  if (editId) {
    const p = byId(editId);
    if (p.code !== code) {
      p.versions = p.versions || [];
      p.versions.push({
        date: p.modified,
        note: document.getElementById("fChange").value.trim() || "Poprzednia wersja",
        code: p.code
      });
    }
    Object.assign(p, data, { modified: Date.now() });
    if (p.source === "disk") {
      const ok = await writeDisk(p);
      toast(ok ? "Zapisano na dysku — " + (p.dir ? p.dir + "/" : "") + p.file
               : "Zapisano w aplikacji — nie udało się zapisać na dysku (" + fsLastError + ")");
      if (ok && selectedPdf && p.dir) {
        const okPdf = await copyPdfToProgram(p, selectedPdf);
        if (okPdf) toast("Skopiowano rysunek " + selectedPdf.name + " do folderu „" + p.dir + "”");
      }
    } else {
      toast("Zapisano zmiany — " + p.name);
    }
  } else {
    const p = Object.assign({ id: uid(), source: "local", fav: false, versions: [], created: Date.now(), modified: Date.now() }, data);
    if (fsRoot) {
      let base = sanitizeName(p.name);
      if (byId("d:" + base + "/" + base + ".txt")) base = base + "_" + (p.onum || Date.now());
      p.dir = base; p.file = base + ".txt"; p.id = "d:" + base + "/" + p.file; p.source = "disk";
      const ok = await writeDisk(p);
      toast(ok ? "Utworzono folder „" + p.dir + "” i zapisano " + p.file
               : "Nie udało się zapisać na dysku (" + fsLastError + ") — program zapisany w aplikacji");
      if (ok && selectedPdf) {
        const okPdf = await copyPdfToProgram(p, selectedPdf);
        if (okPdf) toast("Skopiowano rysunek " + selectedPdf.name + " do folderu „" + p.dir + "”");
      }
    } else {
      toast("Dodano program — " + name);
    }
    programs.push(p);
  }
  save();
  closeModal("mEdit");
  if (viewId && document.getElementById("mView").classList.contains("open")) openView(viewId);
  render();
}

/* ════════════════════ akcje ════════════════════ */
function download(p) {
  let code = p.code || "";
  if (!/^\s*%/.test(code)) code = "%\n" + code;
  if (!/%\s*$/.test(code)) code = code.replace(/\s*$/, "\n%");
  const fname = (p.onum || p.name.replace(/[^\w-]+/g, "_")) + ".nc";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([code], { type: "text/plain" }));
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Pobrano " + fname);
}

async function removeProgram(id) {
  const p = byId(id); if (!p) return;
  const extra = (p.source === "disk" && p.file)
    ? "\n\nPlik zostanie usunięty także z folderu: " + (p.dir ? p.dir + "/" : "") + p.file
    : "";
  if (!confirm('Usunąć program "' + p.name + '" wraz z historią wersji?' + extra)) return;
  if (p.source === "disk" && fsRoot && p.file) {
    if (fsRoot.native) {
      try { await window.native.deleteFile(fsRoot.path, p.dir || "", p.file); } catch (e) {}
    } else {
      try {
        const dh = p.dir ? await fsRoot.getDirectoryHandle(p.dir) : fsRoot;
        await dh.removeEntry(p.file);
      } catch (e) {}
    }
  }
  programs = programs.filter(x => x.id !== id);
  save();
  closeModal("mView");
  render();
  toast("Usunięto program — " + p.name);
}

function restoreVersion(idx) {
  const p = byId(viewId); if (!p || !p.versions || !p.versions[idx]) return;
  const v = p.versions[idx];
  p.versions.push({ date: p.modified, note: "Stan przed przywróceniem wersji", code: p.code });
  p.code = v.code;
  p.modified = Date.now();
  if (p.source === "disk") writeDisk(p);
  save();
  render();
  openView(p.id);
  toast("Przywrócono wersję z " + fmtDate(v.date));
}

/* ════════════════════ modale ════════════════════ */
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

/* ════════════════════ zdarzenia ════════════════════ */
document.getElementById("btnNew").addEventListener("click", () => openEdit(null));
document.getElementById("btnSave").addEventListener("click", saveProgram);
document.getElementById("fOnum").addEventListener("input", checkOnumDup);

document.getElementById("btnFolder").addEventListener("click", async () => {
  if (!fsRoot) { await connectFolder(); return; }
  if (fsRoot.native) { await rescanFolder(); return; }
  let st = "prompt";
  try { st = await fsRoot.queryPermission({ mode: "readwrite" }); } catch (e) {}
  if (st !== "granted") {
    try { st = await fsRoot.requestPermission({ mode: "readwrite" }); } catch (e) {}
    if (st !== "granted") { toast("Brak zgody na dostęp do folderu"); return; }
  }
  updateFolderUI(false);
  await rescanFolder();
});
document.getElementById("btnFolderOff").addEventListener("click", disconnectFolder);

document.getElementById("btnPdf").addEventListener("click", async () => {
  if (!pdfRoot) { await connectPdfFolder(); return; }
  if (pdfRoot.native) { await scanPdfFolder(); return; }
  let st = "prompt";
  try { st = await pdfRoot.queryPermission({ mode: "read" }); } catch (e) {}
  if (st !== "granted") {
    try { st = await pdfRoot.requestPermission({ mode: "read" }); } catch (e) {}
    if (st !== "granted") { toast("Brak zgody na dostęp do folderu z rysunkami"); return; }
  }
  updatePdfUI(false);
  await scanPdfFolder();
});
document.getElementById("btnPdfOff").addEventListener("click", disconnectPdfFolder);

/* pole „Rysunek PDF” w formularzu — łączenie, szukanie, wybór rysunku */
document.getElementById("pdfBox").addEventListener("click", async e => {
  if (e.target.closest("#pdfConnect")) {
    await connectPdfFolder();
    if (pdfRoot) doPdfSearch(true); else renderPdfBox();
    return;
  }
  if (e.target.closest("#pdfSearch")) { doPdfSearch(true); return; }
  const it = e.target.closest("[data-pdf]");
  if (it) {
    const f = pdfCandidates[+it.dataset.pdf];
    selectedPdf = (selectedPdf === f) ? null : f;
    renderPdfBox();
  }
});
document.getElementById("fDrawing").addEventListener("change", () => {
  if (pdfRoot) doPdfSearch(true);
});

/* przełącznik jasnego / ciemnego motywu */
document.getElementById("btnTheme").addEventListener("click", () => {
  const light = !document.body.classList.contains("light");
  document.body.classList.toggle("light", light);
  localStorage.setItem("cncTheme", light ? "light" : "dark");
});
if (localStorage.getItem("cncTheme") === "light") document.body.classList.add("light");

/* przycisk Odśwież — ponowny skan obu folderów */
document.getElementById("btnRefresh").addEventListener("click", async () => {
  if (!fsRoot && !pdfRoot) { toast("Najpierw połącz folder z programami"); return; }
  if (fsRoot) await rescanFolder();
  if (pdfRoot) await scanPdfFolder();
});

/* okno „Dodaj rysunek PDF” z poziomu karty */
document.getElementById("apSearch").addEventListener("input", e => {
  apCandidates = filterPdfs(e.target.value);
  if (!apCandidates.includes(apSelected)) apSelected = apCandidates[0] || null;
  renderApList();
});
document.getElementById("apList").addEventListener("click", e => {
  const it = e.target.closest("[data-ap]");
  if (!it) return;
  const f = apCandidates[+it.dataset.ap];
  apSelected = (apSelected === f) ? null : f;
  renderApList();
});
document.getElementById("apAccept").addEventListener("click", async () => {
  const p = byId(apProgramId);
  if (!p) return;
  if (!apSelected) { toast("Najpierw kliknij rysunek na liście"); return; }
  const ok = await copyPdfToProgram(p, apSelected);
  if (ok) {
    save();
    closeModal("mAddPdf");
    render();
    toast("Dodano rysunek " + apSelected.name + " do „" + p.dir + "”");
  } else {
    toast("Nie udało się skopiować rysunku");
  }
});

document.getElementById("btnFreeOnum").addEventListener("click", () => {
  const free = nextFreeOnum();
  document.getElementById("fOnum").value = free;
  const ta = document.getElementById("fCode");
  if (ta.value.trim()) ta.value = replaceOnumInCode(ta.value, free);
  checkOnumDup();
  toast("Przydzielono wolny numer " + free);
});

/* przeciąganie pliku na pole kodu — wczytanie i wypełnienie rubryk */
const codeTa = document.getElementById("fCode");
["dragenter", "dragover"].forEach(ev => codeTa.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation();
  codeTa.classList.add("hot");
}));
codeTa.addEventListener("dragleave", () => codeTa.classList.remove("hot"));
codeTa.addEventListener("drop", async e => {
  e.preventDefault(); e.stopPropagation();
  codeTa.classList.remove("hot");
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (f) await applyDroppedFile(f);
});

/* przeciągnięcie plików gdziekolwiek na stronę */
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", async e => {
  e.preventDefault();
  if (e.target === codeTa) return;
  const files = [...((e.dataTransfer && e.dataTransfer.files) || [])]
    .filter(f => FILE_RE.test(f.name) || (f.type && f.type.startsWith("text")));
  if (!files.length) return;
  if (document.getElementById("mEdit").classList.contains("open")) {
    await applyDroppedFile(files[0]);
    return;
  }
  closeModal("mView");
  if (files.length === 1) {
    openEdit(null);
    await applyDroppedFile(files[0]);
  } else {
    for (const f of files) await importFile(f);
    save(); render();
    toast("Zaimportowano " + files.length + " programów");
  }
});
document.getElementById("fName").addEventListener("input", e => {
  e.target.classList.remove("bad");
  document.getElementById("hName").classList.remove("show");
});

document.getElementById("btnEdit").addEventListener("click", () => { closeModal("mView"); openEdit(viewId); });
document.getElementById("btnDelete").addEventListener("click", () => removeProgram(viewId));
document.getElementById("btnDownload").addEventListener("click", () => { const p = byId(viewId); if (p) download(p); });

const searchEl = document.getElementById("search");
const clearEl = document.getElementById("searchClear");
searchEl.addEventListener("input", () => {
  query = searchEl.value.trim();
  clearEl.style.display = query ? "block" : "none";
  render();
});
clearEl.addEventListener("click", () => { searchEl.value = ""; query = ""; clearEl.style.display = "none"; render(); searchEl.focus(); });

document.getElementById("filters").addEventListener("click", e => {
  const c = e.target.closest("[data-filter]"); if (!c) return;
  filter = c.dataset.filter;
  render();
});

document.getElementById("grid").addEventListener("click", e => {
  const th = e.target.closest("[data-pdfthumb]");
  if (th) { openPdfModal(th.dataset.pdfthumb); return; }
  const ap = e.target.closest("[data-addpdf]");
  if (ap) { openAddPdf(ap.dataset.addpdf); return; }
  const of = e.target.closest("[data-openfolder]");
  if (of) {
    const p = byId(of.dataset.openfolder);
    if (p && fsRoot && fsRoot.native && p.dir) {
      const target = fsRoot.path + "/" + p.dir + (p.file ? "/" + p.file : "");
      window.native.showInFolder(target).then(r => {
        if (r && !r.ok) toast("Nie udało się otworzyć folderu");
      });
    }
    return;
  }
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    e.stopPropagation();
    const p = byId(fav.dataset.fav);
    p.fav = !p.fav;
    save(); render();
    return;
  }
  const card = e.target.closest(".card");
  if (card) openView(card.dataset.id);
});

document.getElementById("vBody").addEventListener("click", e => {
  const r = e.target.closest("[data-restore]");
  if (r) { e.preventDefault(); restoreVersion(+r.dataset.restore); }
});

document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => closeModal(b.dataset.close)));
document.querySelectorAll(".modal").forEach(m =>
  m.addEventListener("mousedown", e => {
    if (e.target !== m) return;
    // kliknięcie w pasek przewijania okna — nie zamykaj
    const r = m.getBoundingClientRect();
    if (e.clientX - r.left >= m.clientWidth || e.clientY - r.top >= m.clientHeight) return;
    closeModal(m.id);
  }));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelectorAll(".modal.open").forEach(m => closeModal(m.id));
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && document.getElementById("mEdit").classList.contains("open")) {
    e.preventDefault(); saveProgram();
  }
});

/* efekt fali (ripple) po naciśnięciu */
document.addEventListener("pointerdown", e => {
  const t = e.target.closest(".btn, .card, .chip, .x-btn");
  if (!t) return;
  const rect = t.getBoundingClientRect();
  const d = Math.max(rect.width, rect.height) * 2;
  const r = document.createElement("span");
  r.className = "ripple";
  r.style.width = r.style.height = d + "px";
  r.style.left = (e.clientX - rect.left - d / 2) + "px";
  r.style.top = (e.clientY - rect.top - d / 2) + "px";
  t.appendChild(r);
  setTimeout(() => r.remove(), 650);
});

/* ════════════════════ start ════════════════════ */
load();
render();
restoreFolder();
</script>
