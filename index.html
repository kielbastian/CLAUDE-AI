<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Manager — HAAS ST-35Y</title>
<style>
  :root{
    --bg0:#06080f;
    --bg1:#0b1020;
    --card:rgba(255,255,255,.045);
    --card-hi:rgba(255,255,255,.08);
    --stroke:rgba(255,255,255,.09);
    --stroke-hi:rgba(255,255,255,.18);
    --txt:#e9edf7;
    --mut:#8d96ad;
    --ac1:#22d3ee;
    --ac2:#6366f1;
    --ac3:#a855f7;
    --ok:#34d399;
    --warn:#fbbf24;
    --err:#f87171;
    --grad:linear-gradient(135deg,#22d3ee,#6366f1 55%,#a855f7);
    --grad-soft:linear-gradient(135deg,rgba(34,211,238,.16),rgba(99,102,241,.16) 55%,rgba(168,85,247,.16));
    --radius:16px;
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#2a3350 transparent}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    background:var(--bg0);
    color:var(--txt);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ── tło z gradientowymi poświatami ─────────────────────────── */
  .bg{
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(900px 600px at 85% -10%,rgba(168,85,247,.22),transparent 60%),
      radial-gradient(800px 550px at -10% 20%,rgba(34,211,238,.16),transparent 60%),
      radial-gradient(700px 700px at 50% 110%,rgba(99,102,241,.20),transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
  }

  /* ── nagłówek ───────────────────────────────────────────────── */
  header{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(18px);
    background:rgba(8,11,22,.72);
    border-bottom:1px solid var(--stroke);
  }
  .header-in{
    max-width:1400px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .logo{display:flex;align-items:center;gap:12px;user-select:none}
  .logo-mark{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:var(--grad);
    display:grid;place-items:center;
    box-shadow:0 4px 18px rgba(99,102,241,.45);
  }
  .logo-mark svg{width:24px;height:24px}
  .logo h1{
    font-size:1.25rem;font-weight:700;letter-spacing:.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  .machine{
    font-size:.68rem;font-weight:600;letter-spacing:.12em;color:var(--mut);
    border:1px solid var(--stroke);border-radius:999px;padding:4px 10px;
    background:rgba(255,255,255,.03);white-space:nowrap;
  }
  .search-wrap{flex:1;min-width:240px;position:relative}
  .search-wrap svg{
    position:absolute;left:14px;top:50%;translate:0 -50%;
    width:17px;height:17px;stroke:var(--mut);pointer-events:none;
  }
  #search{
    width:100%;padding:11px 40px 11px 42px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--stroke);border-radius:12px;
    color:var(--txt);font-size:.92rem;outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
  }
  #search::placeholder{color:#5d6780}
  #search:focus{
    border-color:var(--ac1);
    background:rgba(255,255,255,.07);
    box-shadow:0 0 0 3px rgba(34,211,238,.15),0 0 24px rgba(34,211,238,.12);
  }
  .search-clear{
    position:absolute;right:8px;top:50%;translate:0 -50%;
    width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;
    background:transparent;color:var(--mut);font-size:1rem;line-height:1;
    display:none;
  }
  .search-clear:hover{background:rgba(255,255,255,.08);color:var(--txt)}

  /* ── przyciski ──────────────────────────────────────────────── */
  .btn{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:12px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);color:var(--txt);
    font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .12s,box-shadow .2s,border-color .2s,background .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:var(--stroke-hi);background:rgba(255,255,255,.09)}
  .btn:active{transform:translateY(1px) scale(.96);box-shadow:0 0 0 3px rgba(255,255,255,.10)}
  .btn svg{width:17px;height:17px;flex:none}
  .btn-primary{
    background:var(--grad);border:none;color:#fff;
    box-shadow:0 4px 20px rgba(99,102,241,.40);
  }
  .btn-primary:hover{box-shadow:0 6px 28px rgba(99,102,241,.60);background:var(--grad)}
  .btn-primary:active{transform:translateY(1px) scale(.96);box-shadow:0 0 0 4px rgba(99,102,241,.30),0 0 30px rgba(168,85,247,.45)}
  .btn-danger{color:#fca5a5}
  .btn-danger:hover{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.10)}
  .btn-danger:active{box-shadow:0 0 0 3px rgba(248,113,113,.25)}
  .btn-sm{padding:8px 14px;font-size:.82rem;border-radius:10px}

  /* efekt fali po naciśnięciu */
  .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 65%);
    transform:scale(0);animation:ripple .6s ease-out forwards;
  }
  @keyframes ripple{to{transform:scale(1);opacity:0}}

  /* ── układ główny ───────────────────────────────────────────── */
  .layout{
    max-width:1400px;margin:0 auto;padding:26px 24px 60px;
    display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start;
  }
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  aside{position:sticky;top:86px;display:flex;flex-direction:column;gap:18px}
  @media(max-width:900px){aside{position:static}}
  .panel{
    background:var(--card);border:1px solid var(--stroke);
    border-radius:var(--radius);padding:16px;
  }
  .panel h3{
    font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mut);margin-bottom:12px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    position:relative;overflow:hidden;
    padding:7px 14px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    color:var(--mut);font-size:.8rem;font-weight:600;font-family:inherit;
    transition:all .18s;-webkit-tap-highlight-color:transparent;
  }
  .chip:hover{color:var(--txt);border-color:var(--stroke-hi)}
  .chip:active{transform:scale(.94);box-shadow:0 0 0 3px rgba(34,211,238,.22)}
  .chip.on{
    background:var(--grad-soft);color:var(--txt);
    border-color:rgba(99,102,241,.55);
    box-shadow:0 0 16px rgba(99,102,241,.25) inset,0 0 12px rgba(99,102,241,.18);
  }
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:12px;padding:12px 10px;text-align:center;
  }
  .stat b{
    display:block;font-size:1.45rem;font-weight:800;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat span{font-size:.68rem;color:var(--mut);letter-spacing:.05em}
  .onums{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto}
  .onum{
    font-family:ui-monospace,Consolas,monospace;font-size:.72rem;
    padding:3px 8px;border-radius:7px;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--mut);
  }
  .onum.dup{color:var(--err);border-color:rgba(248,113,113,.5)}

  /* ── siatka kart ────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{
    position:relative;overflow:hidden;cursor:pointer;
    background:var(--card);border:1px solid var(--stroke);
    border-radius:var(--radius);padding:18px;
    transition:transform .18s,border-color .2s,box-shadow .25s,background .2s;
    animation:fadeUp .35s ease both;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:var(--grad);opacity:0;transition:opacity .25s;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(99,102,241,.45);
    box-shadow:0 14px 38px rgba(0,0,0,.45),0 0 26px rgba(99,102,241,.14);
    background:var(--card-hi);
  }
  .card:hover::before{opacity:1}
  .card:active{
    transform:translateY(0) scale(.985);
    box-shadow:0 0 0 3px rgba(99,102,241,.35),0 0 34px rgba(168,85,247,.30);
  }
  .card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
  .card h2{font-size:1.02rem;font-weight:700;line-height:1.3;flex:1;word-break:break-word}
  .badge-o{
    font-family:ui-monospace,Consolas,monospace;font-size:.72rem;font-weight:700;
    padding:4px 9px;border-radius:8px;flex:none;
    background:var(--grad-soft);border:1px solid rgba(99,102,241,.4);color:#c7d2fe;
  }
  .fav-btn{
    flex:none;width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;
    background:transparent;display:grid;place-items:center;
    transition:transform .15s,background .2s;
  }
  .fav-btn:hover{background:rgba(251,191,36,.12)}
  .fav-btn:active{transform:scale(.8)}
  .fav-btn svg{width:17px;height:17px;fill:none;stroke:#5d6780;stroke-width:2;transition:all .2s}
  .fav-btn.on svg{fill:var(--warn);stroke:var(--warn);filter:drop-shadow(0 0 6px rgba(251,191,36,.6))}
  .card-sub{font-size:.83rem;color:var(--mut);margin-bottom:12px;line-height:1.45}
  .card-sub b{color:#b9c2d8;font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{
    font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:999px;
    background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.28);color:#7dd3fc;
  }
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    font-size:.72rem;color:#5d6780;
    border-top:1px solid var(--stroke);padding-top:11px;
  }
  .card-foot .ver{display:inline-flex;align-items:center;gap:5px}
  .card-foot svg{width:13px;height:13px;stroke:#5d6780}

  .empty{
    grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--mut);
    border:1px dashed var(--stroke);border-radius:var(--radius);
  }
  .empty svg{width:52px;height:52px;stroke:#39415c;margin-bottom:14px}
  .empty p{font-size:.95rem}

  /* ── modale ─────────────────────────────────────────────────── */
  .modal{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:flex-start;justify-content:center;
    padding:4vh 16px;overflow:auto;
    background:rgba(4,6,12,.72);backdrop-filter:blur(8px);
  }
  .modal.open{display:flex}
  .dialog{
    width:100%;max-width:860px;
    background:linear-gradient(180deg,#111730,#0c1120 40%);
    border:1px solid var(--stroke-hi);border-radius:20px;
    box-shadow:var(--shadow),0 0 60px rgba(99,102,241,.15);
    animation:pop .22s cubic-bezier(.3,1.4,.5,1) both;
  }
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
  .dialog-head{
    display:flex;align-items:center;gap:12px;
    padding:20px 24px;border-bottom:1px solid var(--stroke);
  }
  .dialog-head h2{font-size:1.1rem;font-weight:700;flex:1}
  .x-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.04);color:var(--mut);cursor:pointer;
    font-size:1.05rem;line-height:1;transition:all .15s;
  }
  .x-btn:hover{color:var(--txt);border-color:var(--stroke-hi)}
  .x-btn:active{transform:scale(.88);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .dialog-body{padding:22px 24px}
  .dialog-foot{
    display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;
    padding:16px 24px;border-top:1px solid var(--stroke);
  }

  /* formularz */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.fgrid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.wide{grid-column:1/-1}
  .field label{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
  .field input,.field textarea{
    padding:10px 13px;border-radius:11px;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    color:var(--txt);font-size:.9rem;font-family:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .field textarea{resize:vertical;min-height:60px}
  .field textarea.code-in{
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.84rem;min-height:260px;line-height:1.55;
    background:rgba(0,0,0,.35);white-space:pre;
  }
  .field input:focus,.field textarea:focus{
    border-color:var(--ac2);
    box-shadow:0 0 0 3px rgba(99,102,241,.18),0 0 20px rgba(99,102,241,.12);
  }
  .field input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
  .field .hint{font-size:.73rem;color:var(--err);display:none}
  .field .hint.show{display:block}

  /* podgląd programu */
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .meta{
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:11px;padding:10px 12px;
  }
  .meta span{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5d6780;margin-bottom:3px}
  .meta b{font-size:.87rem;font-weight:600;word-break:break-word}
  .sect{margin-top:20px}
  .sect>h3{
    font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .sect>h3::after{content:"";flex:1;height:1px;background:var(--stroke)}
  pre.code{
    background:rgba(0,0,0,.42);border:1px solid var(--stroke);border-radius:13px;
    padding:16px 18px;overflow:auto;max-height:420px;
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.83rem;line-height:1.6;color:#cdd6ea;
  }
  .tk-com{color:#6ee7a0;font-style:italic}
  .tk-g{color:#67e8f9;font-weight:600}
  .tk-m{color:#f0abfc;font-weight:600}
  .tk-n{color:#818cf8}
  .tk-t{color:#fbbf24;font-weight:700}
  .tk-f{color:#fda4af}
  .tk-x{color:#e9edf7}
  .tk-pct{color:#5d6780}
  .tools{display:flex;flex-direction:column;gap:7px}
  .tool{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:10px;padding:9px 13px;font-size:.85rem;
  }
  .tool .tno{
    font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--warn);
    background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);
    border-radius:7px;padding:3px 9px;flex:none;
  }
  .tool .tdesc{color:#b9c2d8}
  .vers{display:flex;flex-direction:column;gap:8px}
  .ver-item{
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:11px;overflow:hidden;
  }
  .ver-item summary{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 14px;cursor:pointer;list-style:none;font-size:.85rem;
    transition:background .15s;
  }
  .ver-item summary::-webkit-details-marker{display:none}
  .ver-item summary:hover{background:rgba(255,255,255,.04)}
  .ver-item summary:active{background:rgba(99,102,241,.14)}
  .ver-date{font-weight:600;color:#b9c2d8}
  .ver-note{color:var(--mut);flex:1}
  .ver-body{padding:0 14px 14px}

  /* powiadomienia */
  #toast{
    position:fixed;bottom:26px;left:50%;translate:-50% 0;z-index:200;
    display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;
  }
  .toast{
    padding:12px 22px;border-radius:12px;font-size:.88rem;font-weight:600;
    background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(99,102,241,.18));
    border:1px solid rgba(99,102,241,.5);color:var(--txt);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 24px rgba(99,102,241,.25);
    animation:toastIn .25s ease both;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .toast.out{animation:toastOut .3s ease both}
  @keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242c48;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#2f3a5e}
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="header-in">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="8"></circle>
          <circle cx="12" cy="12" r="2.6" fill="#fff" stroke="none"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
      </div>
      <h1>CNC Manager</h1>
    </div>
    <span class="machine">HAAS&nbsp;ST-35Y&nbsp;·&nbsp;TOKARKA</span>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
      </svg>
      <input id="search" type="text" autocomplete="off"
             placeholder="Szukaj: nazwa, numer O, klient, materiał, treść kodu…">
      <button class="search-clear" id="searchClear" title="Wyczyść">✕</button>
    </div>
    <button class="btn btn-primary" id="btnNew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      Nowy program
    </button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="panel">
      <h3>Filtry</h3>
      <div class="chips" id="filters"></div>
    </div>
    <div class="panel">
      <h3>Statystyki</h3>
      <div class="stats">
        <div class="stat"><b id="stProg">0</b><span>programy</span></div>
        <div class="stat"><b id="stVer">0</b><span>wersje</span></div>
        <div class="stat"><b id="stFav">0</b><span>ulubione</span></div>
        <div class="stat"><b id="stCli">0</b><span>klienci</span></div>
      </div>
    </div>
    <div class="panel">
      <h3>Zajęte numery O</h3>
      <div class="onums" id="onums"></div>
    </div>
  </aside>

  <section class="grid" id="grid"></section>
</div>

<!-- ── modal: nowy / edycja ─────────────────────────────────────── -->
<div class="modal" id="mEdit">
  <div class="dialog">
    <div class="dialog-head">
      <h2 id="mEditTitle">Nowy program</h2>
      <button class="x-btn" data-close="mEdit">✕</button>
    </div>
    <div class="dialog-body">
      <div class="fgrid">
        <div class="field">
          <label>Nazwa programu</label>
          <input id="fName" type="text">
          <span class="hint" id="hName">Podaj nazwę programu</span>
        </div>
        <div class="field">
          <label>Numer O</label>
          <input id="fOnum" type="text" placeholder="O00125">
          <span class="hint" id="hOnum">Ten numer O jest już zajęty przez inny program</span>
        </div>
        <div class="field">
          <label>Detal</label>
          <input id="fDetail" type="text">
        </div>
        <div class="field">
          <label>Nr rysunku</label>
          <input id="fDrawing" type="text">
        </div>
        <div class="field">
          <label>Klient</label>
          <input id="fClient" type="text">
        </div>
        <div class="field">
          <label>Materiał</label>
          <input id="fMaterial" type="text">
        </div>

          <path d="M17 21v-8H7v8M7 3v5h8"></path>

        Zapisz program

</div>

<!-- ── modal: podgląd ───────────────────────────────────────────── -->
<div class="modal" id="mView">

          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"></path>

          <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        Edytuj
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ════════════════════ dane ════════════════════ */
const LS_KEY = "cncPrograms_v1";
let programs = [];
let query = "";
let filter = "all";      // all | fav | tag:xxx
let editId = null;       // id edytowanego programu (null = nowy)
let viewId = null;       // id programu w podglądzie

const SEED = [

    created: now - 86400000 * 7, modified: now - 86400000 * 1,
    code: `%

function load() {
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  try { programs = raw ? JSON.parse(raw) : SEED; } catch (e) { programs = SEED; }
  if (!raw) save();
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(programs)); }
const byId = id => programs.find(p => p.id === id);
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ════════════════════ narzędzia ════════════════════ */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmtDate = t => new Date(t).toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" }) +
  " " + new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });

function hlCode(code) {
  return esc(code).replace(/\([^)\n]*\)?|[A-Za-z][+-]?\d+\.?\d*|%/g, tok => {
    if (tok[0] === "(") return '<span class="tk-com">' + tok + "</span>";
    if (tok === "%") return '<span class="tk-pct">%</span>';
    const L = tok[0].toUpperCase();
    if (L === "G") return '<span class="tk-g">' + tok + "</span>";
    if (L === "M") return '<span class="tk-m">' + tok + "</span>";
    if (L === "O" || L === "N") return '<span class="tk-n">' + tok + "</span>";
    if (L === "T") return '<span class="tk-t">' + tok + "</span>";
    if (L === "S" || L === "F") return '<span class="tk-f">' + tok + "</span>";
    return '<span class="tk-x">' + tok + "</span>";
  });
}

function extractTools(code) {
  const map = new Map();
  (code || "").split("\n").forEach(line => {
    const m = line.match(/(?:^|[^A-Za-z(])T(\d{2,4})/);
    if (m) {
      const key = "T" + m[1];
      const com = (line.match(/\(([^)]*)\)/) || [])[1] || "";
      if (!map.has(key) || com) map.set(key, com.trim());
    }
  });
  return [...map.entries()];
}

function extractOffsets(code) {
  return [...new Set((code || "").match(/G5[4-9]|G154\s*P\d+/g) || [])];
}

function toast(msg) {
  const box = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, 2400);
}

/* ════════════════════ renderowanie ════════════════════ */
function matches(p) {
  if (filter === "fav" && !p.fav) return false;
  if (filter.startsWith("tag:") && !(p.tags || []).includes(filter.slice(4))) return false;
  if (!query) return true;
  const hay = [p.name, p.onum, p.detail, p.drawing, p.client, p.material,
               (p.tags || []).join(" "), p.note, p.code].join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function render() {
  const grid = document.getElementById("grid");
  const list = programs.filter(matches).sort((a, b) => b.modified - a.modified);

  if (!list.length) {
    grid.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3M8 11h6"></path>
      </svg>
      <p>${programs.length ? "Brak programów pasujących do wyszukiwania." : "Biblioteka jest pusta — dodaj pierwszy program."}</p>
    </div>`;
  } else {
    grid.innerHTML = list.map((p, i) => `
      <article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i * 40, 320)}ms">
        <div class="card-top">
          <h2>${esc(p.name)}</h2>
          ${p.onum ? `<span class="badge-o">${esc(p.onum)}</span>` : ""}
          <button class="fav-btn ${p.fav ? "on" : ""}" data-fav="${p.id}" title="Ulubione">
            <svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
          </button>
        </div>
        <div class="card-sub">
          ${p.client ? `<b>${esc(p.client)}</b>` : ""}${p.client && p.material ? " · " : ""}${esc(p.material || "")}
          ${p.drawing ? `<br>rys. ${esc(p.drawing)}` : ""}
        </div>
        ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="card-foot">
          <span>${fmtDate(p.modified)}</span>
          <span class="ver">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
              <path d="M12 8v4l2.5 2.5"></path><circle cx="12" cy="12" r="9"></circle>
            </svg>
            ${(p.versions || []).length + 1} wer.
          </span>
        </div>
      </article>`).join("");
  }

  renderSidebar();
}

function renderSidebar() {
  // filtry
  const allTags = [...new Set(programs.flatMap(p => p.tags || []))].sort((a, b) => a.localeCompare(b, "pl"));
  const chips = [
    { key: "all", label: "Wszystkie" },
    { key: "fav", label: "★ Ulubione" },
    ...allTags.map(t => ({ key: "tag:" + t, label: t }))
  ];
  document.getElementById("filters").innerHTML = chips.map(c =>
    `<button class="chip ${filter === c.key ? "on" : ""}" data-filter="${esc(c.key)}">${esc(c.label)}</button>`).join("");

  // statystyki
  document.getElementById("stProg").textContent = programs.length;
  document.getElementById("stVer").textContent = programs.reduce((s, p) => s + (p.versions || []).length + 1, 0);
  document.getElementById("stFav").textContent = programs.filter(p => p.fav).length;
  document.getElementById("stCli").textContent = new Set(programs.map(p => (p.client || "").trim().toLowerCase()).filter(Boolean)).size;

  // numery O
  const counts = {};
  programs.forEach(p => { if (p.onum) counts[p.onum] = (counts[p.onum] || 0) + 1; });
  const nums = Object.keys(counts).sort();
  document.getElementById("onums").innerHTML = nums.length
    ? nums.map(n => `<span class="onum ${counts[n] > 1 ? "dup" : ""}" ${counts[n] > 1 ? 'title="Numer zdublowany!"' : ""}>${esc(n)}</span>`).join("")
    : '<span style="font-size:.78rem;color:#5d6780">Brak przypisanych numerów</span>';
}

/* ════════════════════ podgląd programu ════════════════════ */
function openView(id) {
  const p = byId(id); if (!p) return;
  viewId = id;
  document.getElementById("vTitle").textContent = p.name;
  const ob = document.getElementById("vOnum");
  ob.textContent = p.onum || "";
  ob.style.display = p.onum ? "" : "none";

  const tools = extractTools(p.code);
  const offsets = extractOffsets(p.code);
  const meta = [
    ["Detal", p.detail], ["Nr rysunku", p.drawing], ["Klient", p.client],
    ["Materiał", p.material], ["Utworzono", fmtDate(p.created)], ["Zmieniono", fmtDate(p.modified)]
  ].filter(m => m[1]);

  document.getElementById("vBody").innerHTML = `
    <div class="meta-grid">
      ${meta.map(m => `<div class="meta"><span>${m[0]}</span><b>${esc(m[1])}</b></div>`).join("")}
      ${offsets.length ? `<div class="meta"><span>Bazy</span><b>${offsets.map(esc).join(", ")}</b></div>` : ""}
    </div>
    ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${p.note ? `<div class="sect"><h3>Notatka</h3><div style="font-size:.88rem;color:#b9c2d8;line-height:1.55">${esc(p.note)}</div></div>` : ""}
    <div class="sect"><h3>Kod programu</h3><pre class="code">${hlCode(p.code || "")}</pre></div>
    ${tools.length ? `<div class="sect"><h3>Narzędzia w programie</h3>
      <div class="tools">${tools.map(([t, d]) =>
        `<div class="tool"><span class="tno">${esc(t)}</span><span class="tdesc">${esc(d) || "—"}</span></div>`).join("")}</div></div>` : ""}
    <div class="sect"><h3>Historia wersji</h3>
      ${(p.versions || []).length ? `<div class="vers">${p.versions.slice().reverse().map((v, ri) => {
        const idx = p.versions.length - 1 - ri;
        return `<details class="ver-item">
          <summary>
            <span class="ver-date">${fmtDate(v.date)}</span>
            <span class="ver-note">${esc(v.note || "bez opisu")}</span>
            <button class="btn btn-sm" data-restore="${idx}">Przywróć</button>
          </summary>
          <div class="ver-body"><pre class="code">${hlCode(v.code || "")}</pre></div>
        </details>`;
      }).join("")}</div>`
      : '<div style="font-size:.83rem;color:#5d6780">Ten program ma tylko wersję bieżącą.</div>'}
    </div>`;

  openModal("mView");
}

/* ════════════════════ formularz ════════════════════ */
function openEdit(id) {
  editId = id || null;
  const p = id ? byId(id) : null;
  document.getElementById("mEditTitle").textContent = p ? "Edycja: " + p.name : "Nowy program";
  document.getElementById("fName").value = p ? p.name : "";
  document.getElementById("fOnum").value = p ? p.onum || "" : "";
  document.getElementById("fDetail").value = p ? p.detail || "" : "";
  document.getElementById("fDrawing").value = p ? p.drawing || "" : "";
  document.getElementById("fClient").value = p ? p.client || "" : "";
  document.getElementById("fMaterial").value = p ? p.material || "" : "";
  document.getElementById("fTags").value = p ? (p.tags || []).join(", ") : "";
  document.getElementById("fNote").value = p ? p.note || "" : "";
  document.getElementById("fCode").value = p ? p.code || "" : "";
  document.getElementById("fChange").value = "";
  document.getElementById("fChangeWrap").style.display = p ? "" : "none";
  document.getElementById("fName").classList.remove("bad");
  document.getElementById("fOnum").classList.remove("bad");
  document.getElementById("hName").classList.remove("show");
  document.getElementById("hOnum").classList.remove("show");
  openModal("mEdit");
  setTimeout(() => document.getElementById("fName").focus(), 60);
}

function checkOnumDup() {
  const val = document.getElementById("fOnum").value.trim().toUpperCase();
  const dup = val && programs.some(p => p.id !== editId && (p.onum || "").toUpperCase() === val);
  document.getElementById("fOnum").classList.toggle("bad", dup);
  document.getElementById("hOnum").classList.toggle("show", dup);
  return dup;
}

function saveProgram() {
  const name = document.getElementById("fName").value.trim();
  if (!name) {
    document.getElementById("fName").classList.add("bad");
    document.getElementById("hName").classList.add("show");
    document.getElementById("fName").focus();
    return;
  }
  let onum = document.getElementById("fOnum").value.trim().toUpperCase();
  const code = document.getElementById("fCode").value;
  if (!onum) {
    const m = code.match(/^\s*O(\d{3,5})/m);
    if (m) onum = "O" + m[1];
  }
  const data = {
    name,
    onum,
    detail: document.getElementById("fDetail").value.trim(),
    drawing: document.getElementById("fDrawing").value.trim(),
    client: document.getElementById("fClient").value.trim(),
    material: document.getElementById("fMaterial").value.trim(),
    tags: document.getElementById("fTags").value.split(",").map(t => t.trim()).filter(Boolean),
    note: document.getElementById("fNote").value.trim(),
    code
  };

  if (editId) {
    const p = byId(editId);
    if (p.code !== code) {
      p.versions = p.versions || [];
      p.versions.push({
        date: p.modified,
        note: document.getElementById("fChange").value.trim() || "Poprzednia wersja",
        code: p.code
      });
    }
    Object.assign(p, data, { modified: Date.now() });
    toast("Zapisano zmiany — " + p.name);
  } else {
    programs.push(Object.assign({ id: uid(), fav: false, versions: [], created: Date.now(), modified: Date.now() }, data));
    toast("Dodano program — " + name);
  }
  save();
  closeModal("mEdit");
  if (viewId && document.getElementById("mView").classList.contains("open")) openView(viewId);
  render();
}

/* ════════════════════ akcje ════════════════════ */
function download(p) {
  let code = p.code || "";
  if (!/^\s*%/.test(code)) code = "%\n" + code;
  if (!/%\s*$/.test(code)) code = code.replace(/\s*$/, "\n%");
  const fname = (p.onum || p.name.replace(/[^\w-]+/g, "_")) + ".nc";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([code], { type: "text/plain" }));
  a.download = fname;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Pobrano " + fname);
}

function removeProgram(id) {
  const p = byId(id); if (!p) return;
  if (!confirm('Usunąć program "' + p.name + '" wraz z historią wersji?')) return;
  programs = programs.filter(x => x.id !== id);
  save();
  closeModal("mView");
  render();
  toast("Usunięto program — " + p.name);
}

function restoreVersion(idx) {
  const p = byId(viewId); if (!p || !p.versions || !p.versions[idx]) return;
  const v = p.versions[idx];
  p.versions.push({ date: p.modified, note: "Stan przed przywróceniem wersji", code: p.code });
  p.code = v.code;
  p.modified = Date.now();
  save();
  render();
  openView(p.id);
  toast("Przywrócono wersję z " + fmtDate(v.date));
}

/* ════════════════════ modale ════════════════════ */
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }

/* ════════════════════ zdarzenia ════════════════════ */
document.getElementById("btnNew").addEventListener("click", () => openEdit(null));
document.getElementById("btnSave").addEventListener("click", saveProgram);
document.getElementById("fOnum").addEventListener("input", checkOnumDup);
document.getElementById("fName").addEventListener("input", e => {
  e.target.classList.remove("bad");
  document.getElementById("hName").classList.remove("show");
});

document.getElementById("btnEdit").addEventListener("click", () => { closeModal("mView"); openEdit(viewId); });
document.getElementById("btnDelete").addEventListener("click", () => removeProgram(viewId));
document.getElementById("btnDownload").addEventListener("click", () => { const p = byId(viewId); if (p) download(p); });

const searchEl = document.getElementById("search");
const clearEl = document.getElementById("searchClear");
searchEl.addEventListener("input", () => {
  query = searchEl.value.trim();
  clearEl.style.display = query ? "block" : "none";
  render();
});
clearEl.addEventListener("click", () => { searchEl.value = ""; query = ""; clearEl.style.display = "none"; render(); searchEl.focus(); });

document.getElementById("filters").addEventListener("click", e => {
  const c = e.target.closest("[data-filter]"); if (!c) return;
  filter = c.dataset.filter;
  render();
});

document.getElementById("grid").addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) {
    e.stopPropagation();
    const p = byId(fav.dataset.fav);
    p.fav = !p.fav;
    save(); render();
    return;
  }
  const card = e.target.closest(".card");
  if (card) openView(card.dataset.id);
});

document.getElementById("vBody").addEventListener("click", e => {
  const r = e.target.closest("[data-restore]");
  if (r) { e.preventDefault(); restoreVersion(+r.dataset.restore); }
});

document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => closeModal(b.dataset.close)));
document.querySelectorAll(".modal").forEach(m =>
  m.addEventListener("mousedown", e => { if (e.target === m) closeModal(m.id); }));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.querySelectorAll(".modal.open").forEach(m => closeModal(m.id));
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && document.getElementById("mEdit").classList.contains("open")) {
    e.preventDefault(); saveProgram();
  }
});

/* efekt fali (ripple) po naciśnięciu */
document.addEventListener("pointerdown", e => {
  const t = e.target.closest(".btn, .card, .chip, .x-btn");
  if (!t) return;
  const rect = t.getBoundingClientRect();
  const d = Math.max(rect.width, rect.height) * 2;
  const r = document.createElement("span");
  r.className = "ripple";
  r.style.width = r.style.height = d + "px";
  r.style.left = (e.clientX - rect.left - d / 2) + "px";
  r.style.top = (e.clientY - rect.top - d / 2) + "px";
  t.appendChild(r);
  setTimeout(() => r.remove(), 650);
});

/* ════════════════════ start ════════════════════ */
load();
render();
</script>
</body>
</html>
