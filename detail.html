<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podgląd programu — CNC Manager</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
  :root{
    --bg0:#0c1020;
    --bg1:#141a2e;
    --card:rgba(255,255,255,.075);
    --stroke:rgba(255,255,255,.13);
    --stroke-hi:rgba(255,255,255,.24);
    --txt:#e9edf7;
    --mut:#8d96ad;
    --ac1:#22d3ee;
    --ac2:#6366f1;
    --ac3:#a855f7;
    --ac1-rgb:34,211,238;
    --ac2-rgb:99,102,241;
    --ac3-rgb:168,85,247;
    --ok:#34d399;
    --warn:#fbbf24;
    --err:#f87171;
    --grad:linear-gradient(135deg,#22d3ee,#6366f1 55%,#a855f7);
    --grad-soft:linear-gradient(135deg,rgba(var(--ac1-rgb),.16),rgba(var(--ac2-rgb),.16) 55%,rgba(var(--ac3-rgb),.16));
    --radius:14px;
  }
  body.theme-orange{
    --ac1:#fbbf24; --ac1-rgb:251,191,36;
    --ac2:#f97316; --ac2-rgb:249,115,22;
    --ac3:#fb923c; --ac3-rgb:251,146,60;
    --grad:linear-gradient(135deg,#fbbf24,#fb923c 42%,#f97316);
  }
  body.theme-green{
    --ac1:#4ade80; --ac1-rgb:74,222,128;
    --ac2:#22c55e; --ac2-rgb:34,197,94;
    --ac3:#34d399; --ac3-rgb:52,211,153;
    --grad:linear-gradient(135deg,#4ade80,#22c55e 45%,#16a34a);
  }
  body.theme-red{
    --ac1:#fb7185; --ac1-rgb:251,113,133;
    --ac2:#ef4444; --ac2-rgb:239,68,68;
    --ac3:#f87171; --ac3-rgb:248,113,113;
    --grad:linear-gradient(135deg,#fb7185,#ef4444 45%,#dc2626);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#2a3350 transparent}
  body{
    font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    font-weight:500;
    background:var(--bg0);color:var(--txt);
    height:100vh;overflow:hidden;display:flex;flex-direction:column;
  }
  .bg{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
  }
  .glow{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
  .glow.g1{
    width:1300px;height:900px;top:-22%;right:-12%;
    background:radial-gradient(closest-side,rgba(var(--ac3-rgb),.22),transparent 70%);
    animation:drift1 19s ease-in-out infinite alternate;
  }
  .glow.g2{
    width:1150px;height:850px;top:2%;left:-16%;
    background:radial-gradient(closest-side,rgba(var(--ac1-rgb),.16),transparent 70%);
    animation:drift2 23s ease-in-out infinite alternate;
  }
  .glow.g3{
    width:1050px;height:1050px;bottom:-34%;left:32%;
    background:radial-gradient(closest-side,rgba(var(--ac2-rgb),.18),transparent 70%);
    animation:drift3 16s ease-in-out infinite alternate;
  }
  @keyframes drift1{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-200px,130px) scale(1.15)}
    100%{transform:translate(-80px,240px) scale(1.05)}
  }
  @keyframes drift2{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(220px,110px) scale(1.18)}
    100%{transform:translate(100px,-60px) scale(1.08)}
  }
  @keyframes drift3{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(170px,-170px) scale(1.13)}
    100%{transform:translate(-130px,-70px) scale(1.06)}
  }
  body.no-motion .glow{animation:none !important}
  @media (prefers-reduced-motion: reduce){.glow{animation:none}}

  /* ── zintegrowany pasek okna ── */
  .titlebar{
    position:sticky;top:0;z-index:50;flex:none;
    display:flex;align-items:center;gap:12px;height:44px;padding:0 4px 0 16px;
    background:rgba(8,11,22,.82);backdrop-filter:blur(18px);
    border-bottom:1px solid var(--stroke);
    -webkit-app-region:drag;
  }
  .titlebar .tb-icon{
    width:26px;height:26px;border-radius:8px;flex:none;background:var(--grad);
    display:grid;place-items:center;box-shadow:0 3px 12px rgba(var(--ac2-rgb),.45);
  }
  .titlebar .tb-icon svg{width:15px;height:15px}
  .tb-title{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .tb-onum{
    font-family:'Orbitron','Rajdhani',sans-serif;font-size:.95rem;font-weight:800;
    padding:5px 12px;border-radius:9px;flex:none;letter-spacing:.03em;
    background:var(--grad-soft);border:1px solid rgba(var(--ac2-rgb),.55);color:#dbe3ff;
    -webkit-app-region:no-drag;
  }
  .win-ctrl{display:flex;align-items:center;gap:1px;flex:none;-webkit-app-region:no-drag}
  .win-btn{
    width:42px;height:44px;border:none;background:transparent;color:var(--mut);
    cursor:pointer;display:grid;place-items:center;font-size:.9rem;
    transition:background .15s,color .15s;
  }
  .win-btn:hover{background:rgba(255,255,255,.08);color:var(--txt)}
  .win-btn:active{background:rgba(255,255,255,.12)}
  .win-btn.close:hover{background:rgba(248,113,113,.22);color:#fff}

  /* ── treść ── */
  .body{flex:1;overflow:auto;padding:22px 24px}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .meta{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:11px;padding:10px 12px}
  .meta span{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5d6780;margin-bottom:3px}
  .meta b{font-size:.87rem;font-weight:600;word-break:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:999px;
    background:rgba(var(--ac1-rgb),.10);border:1px solid rgba(var(--ac1-rgb),.28);color:#7dd3fc}
  .sect{margin-top:20px}
  .sect>h3{
    font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .sect>h3::after{content:"";flex:1;height:1px;background:var(--stroke)}
  pre.code{
    background:rgba(0,0,0,.42);border:1px solid var(--stroke);border-radius:13px;
    padding:16px 18px;overflow:auto;
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.83rem;line-height:1.6;color:#cdd6ea;
  }
  .tk-com{color:#6ee7a0;font-style:italic}
  .tk-g{color:#67e8f9;font-weight:600}
  .tk-m{color:#f0abfc;font-weight:600}
  .tk-n{color:#818cf8}
  .tk-t{color:#fbbf24;font-weight:700}
  .tk-f{color:#fda4af}
  .tk-x{color:#e9edf7}
  .tk-pct{color:#5d6780}
  .tools{display:flex;flex-direction:column;gap:7px}
  .tool{display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:10px;padding:9px 13px;font-size:.85rem}
  .tool .tno{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--warn);
    background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);
    border-radius:7px;padding:3px 9px;flex:none}
  .tool .tdesc{color:#b9c2d8}
  .note-box{font-size:.88rem;color:#b9c2d8;line-height:1.55}
  .vers{display:flex;flex-direction:column;gap:8px}
  .ver-item{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:11px;overflow:hidden}
  .ver-item summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 14px;cursor:pointer;list-style:none;font-size:.85rem;transition:background .15s}
  .ver-item summary::-webkit-details-marker{display:none}
  .ver-item summary:hover{background:rgba(255,255,255,.04)}
  .ver-date{font-weight:600;color:#b9c2d8}
  .ver-note{color:var(--mut);flex:1}
  .ver-body{padding:0 14px 14px}

  /* ── stopka z akcjami ── */
  .foot{
    flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 20px;border-top:1px solid var(--stroke);
    background:rgba(8,11,22,.55);backdrop-filter:blur(10px);
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:11px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);color:var(--txt);
    font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .12s,border-color .2s,background .2s;
  }
  .btn:hover{border-color:var(--stroke-hi);background:rgba(255,255,255,.09)}
  .btn:active{transform:translateY(1px) scale(.97)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn-primary{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 18px rgba(var(--ac2-rgb),.40)}
  .btn-primary:hover{background:var(--grad);box-shadow:0 6px 24px rgba(var(--ac2-rgb),.55)}
  .btn-danger{color:#fca5a5}
  .btn-danger:hover{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.10)}

  /* ── formularz edycji (w tym samym oknie) ── */
  .efgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.efgrid{grid-template-columns:1fr}}
  .efield{display:flex;flex-direction:column;gap:6px}
  .efield.wide{grid-column:1/-1}
  .efield label{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
  .efield input,.efield textarea{
    padding:10px 13px;border-radius:11px;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    color:var(--txt);font-size:.9rem;font-family:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .efield textarea{resize:vertical;min-height:60px}
  .efield textarea.code-in{
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.84rem;min-height:280px;line-height:1.55;
    background:rgba(0,0,0,.35);white-space:pre;
  }
  .efield input:focus,.efield textarea:focus{
    border-color:var(--ac2);
    box-shadow:0 0 0 3px rgba(var(--ac2-rgb),.18),0 0 20px rgba(var(--ac2-rgb),.12);
  }
  .efield input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
  body.light .efield input,body.light .efield textarea{background:rgba(15,23,42,.05)}
  body.light .efield textarea.code-in{background:#111726;color:#e9edf7}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242c48;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#2f3a5e}

  /* ── toast ── */
  #toast{position:fixed;bottom:70px;left:50%;translate:-50% 0;z-index:200;
    display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{padding:11px 20px;border-radius:12px;font-size:.86rem;font-weight:600;
    background:linear-gradient(135deg,rgba(var(--ac1-rgb),.18),rgba(var(--ac2-rgb),.18));
    border:1px solid rgba(var(--ac2-rgb),.5);color:var(--txt);backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .25s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ── jasny motyw ── */
  body.light{
    --bg0:#dfe4ee;--bg1:#ccd4e4;
    --card:rgba(255,255,255,.9);--stroke:rgba(15,23,42,.14);--stroke-hi:rgba(15,23,42,.3);
    --txt:#1b2333;--mut:#5b6474;
  }
  body.light .glow.g1{background:radial-gradient(closest-side,rgba(var(--ac3-rgb),.15),transparent 70%)}
  body.light .glow.g2{background:radial-gradient(closest-side,rgba(var(--ac1-rgb),.14),transparent 70%)}
  body.light .glow.g3{background:radial-gradient(closest-side,rgba(var(--ac2-rgb),.12),transparent 70%)}
  body.light .titlebar{background:rgba(255,255,255,.85)}
  body.light .foot{background:rgba(255,255,255,.6)}
  body.light .win-btn:hover{background:rgba(15,23,42,.10)}
  body.light .win-btn.close:hover{background:rgba(248,113,113,.85);color:#fff}
  body.light .meta,body.light .tool,body.light .ver-item{background:rgba(15,23,42,.035)}
  body.light .tb-onum{color:#4338ca}
  body.light .tag{color:#0e7490;background:rgba(14,116,144,.08);border-color:rgba(14,116,144,.3)}
  body.light .note-box,body.light .tool .tdesc,body.light .ver-date{color:#3a465c}
  body.light .btn{background:rgba(255,255,255,.75)}
  body.light .btn:hover{background:#fff}
  body.light .btn-primary{background:var(--grad);color:#fff}
  body.light .toast{color:#1b2333;background:linear-gradient(135deg,rgba(var(--ac1-rgb),.20),rgba(var(--ac2-rgb),.16)),#fff}
  body.light ::-webkit-scrollbar-thumb{background:#c3cbdc}

  /* ── generator / podgląd konturu 2D (backplot z G-kodu) ── */
  .bp-overlay{position:fixed;inset:0;z-index:300;display:flex;background:#4b52d6}
  .bp-canvas{flex:1;display:block;width:100%;height:100%;cursor:default}
  .bp-canvas.drag{cursor:grabbing}
  .bp-bar{
    position:absolute;top:0;left:0;right:0;height:52px;z-index:2;
    display:flex;align-items:center;gap:9px;padding:0 12px;
    -webkit-app-region:drag;
    background:linear-gradient(180deg,rgba(6,9,20,.55),rgba(6,9,20,0));
  }
  .bp-bar .bp-title{
    font-weight:700;font-size:.92rem;color:#fff;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .bp-bar .bp-onum{
    font-family:'Orbitron','Rajdhani',sans-serif;font-weight:800;font-size:.82rem;color:#fff;flex:none;
    background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 10px;
  }
  .bp-btn{
    -webkit-app-region:no-drag;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    font-family:inherit;font-weight:600;font-size:.8rem;color:#fff;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:7px 11px;
    transition:background .15s,border-color .15s,color .15s;
  }
  .bp-btn:hover{background:rgba(255,255,255,.24)}
  .bp-btn.on{background:rgba(255,255,255,.92);color:#1b2333;border-color:#fff}
  .bp-btn svg{width:15px;height:15px;flex:none}
  .bp-btn.close{background:rgba(248,113,113,.28);border-color:rgba(248,113,113,.6)}
  .bp-btn.close:hover{background:rgba(248,113,113,.55)}
  .bp-info{
    position:absolute;left:14px;bottom:12px;z-index:2;display:flex;gap:14px;flex-wrap:wrap;
    font-size:.8rem;color:#eef1ff;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none;
  }
  .bp-info b{color:#fff;font-weight:700}
  .bp-legend{
    position:absolute;right:14px;bottom:12px;z-index:2;display:flex;gap:16px;
    font-size:.76rem;color:#eef1ff;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none;
  }
  .bp-legend span{display:inline-flex;align-items:center;gap:7px}
  .bp-swatch{display:inline-block;width:22px;height:0;border-top:2px solid #ffd60a}
  .bp-swatch.rap{border-top:2px dashed rgba(255,255,255,.8)}
  .bp-swatch.hole{border-top-color:#ffb454}
  .bp-swatch.thr{border-top-color:#ff77c8}
  .bp-empty{
    position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;
    color:#fff;font-size:.95rem;text-align:center;padding:30px;text-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  .bp-hint{
    position:absolute;left:50%;top:60px;translate:-50% 0;z-index:2;pointer-events:none;
    font-size:.72rem;color:rgba(255,255,255,.7);text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .bp-tip{
    position:absolute;z-index:4;display:none;pointer-events:none;white-space:nowrap;
    background:rgba(8,11,22,.9);border:1px solid rgba(255,255,255,.28);border-radius:9px;
    padding:7px 10px;font-size:.8rem;color:#e9edf7;line-height:1.35;
    box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .bp-tip-row{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace}
  .bp-tip-row span{display:inline-block;width:15px;color:#8d96ad;font-weight:700}
  .bp-tip-row b{color:#fff;font-weight:700}
  .bp-tip-sub{color:#8d96ad;font-size:.72rem;margin-top:1px}
</style>
</head>
<body>
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

<div class="titlebar">
  <div class="tb-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="8"></circle>
      <circle cx="12" cy="12" r="2.6" fill="#fff" stroke="none"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
  </div>
  <span class="tb-title" id="tbTitle">Podgląd programu</span>
  <span class="tb-onum" id="tbOnum" style="display:none"></span>
  <div class="win-ctrl">
    <button class="win-btn" id="btnMin" title="Minimalizuj">&#8211;</button>
    <button class="win-btn" id="btnMax" title="Maksymalizuj">&#9633;</button>
    <button class="win-btn close" id="btnClose" title="Zamknij">&#10005;</button>
  </div>
</div>

<div class="body">
  <div id="viewPane"></div>
  <div id="editPane" style="display:none">
    <div class="efgrid">
      <div class="efield"><label>Nazwa programu</label><input id="eName" type="text"></div>
      <div class="efield"><label>Numer O</label><input id="eOnum" type="text" placeholder="O00125"></div>
      <div class="efield"><label>Detal</label><input id="eDetail" type="text"></div>
      <div class="efield"><label>Nr rysunku</label><input id="eDrawing" type="text"></div>
      <div class="efield"><label>Klient</label><input id="eClient" type="text"></div>
      <div class="efield"><label>Materiał</label><input id="eMaterial" type="text"></div>
      <div class="efield wide"><label>Tagi (po przecinku)</label><input id="eTags" type="text" placeholder="wałek, gwint, nierdzewka"></div>
      <div class="efield wide"><label>Notatka</label><textarea id="eNote" rows="2"></textarea></div>
      <div class="efield wide"><label>Opis zmian — do historii wersji</label><input id="eChange" type="text" placeholder="np. zmieniony posuw wykańczaka z F0.15 na F0.2"></div>
      <div class="efield wide"><label>Kod programu — G-kod</label><textarea id="eCode" class="code-in" spellcheck="false"></textarea></div>
    </div>
  </div>
</div>

<div class="foot" id="footView">
  <button class="btn btn-danger" id="btnDelete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"></path>
    </svg>
    Usuń
  </button>
  <button class="btn" id="btnSketch" title="Otwórz w Eksploratorze folder szkicu (rysunku) przypisanego do tego programu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
    </svg>
    Otwórz folder rysunku
  </button>
  <span style="flex:1"></span>
  <button class="btn" id="btnCopy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="12" height="12" rx="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    Kopiuj kod
  </button>
  <button class="btn" id="btnDownload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"></path>
    </svg>
    Pobierz .nc
  </button>
  <button class="btn" id="btnBackplot" title="Podgląd konturu — rysuje zarys detalu z toru narzędzia (G-kod)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 17h3l3-8h6l3 8h3"></path>

<script>
"use strict";
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmtDate = t => new Date(t).toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" }) +
  " " + new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });

function hlCode(code) {
  return esc(code).replace(/\([^)\n]*\)?|[A-Za-z][+-]?\d+\.?\d*|%/g, tok => {
    if (tok[0] === "(") return '<span class="tk-com">' + tok + "</span>";
    if (tok === "%") return '<span class="tk-pct">%</span>';
    const L = tok[0].toUpperCase();
    if (L === "G") return '<span class="tk-g">' + tok + "</span>";
    if (L === "M") return '<span class="tk-m">' + tok + "</span>";
    if (L === "O" || L === "N") return '<span class="tk-n">' + tok + "</span>";
    if (L === "T") return '<span class="tk-t">' + tok + "</span>";
    if (L === "S" || L === "F") return '<span class="tk-f">' + tok + "</span>";
    return '<span class="tk-x">' + tok + "</span>";
  });
}
function extractTools(code) {
  const map = new Map();
  (code || "").split("\n").forEach(line => {
    const m = line.match(/(?:^|[^A-Za-z(])T(\d{2,4})/);
    if (m) {
      const key = "T" + m[1];
      const com = (line.match(/\(([^)]*)\)/) || [])[1] || "";
      if (!map.has(key) || com) map.set(key, com.trim());
    }
  });
  return [...map.entries()];
}
function extractOffsets(code) {
  return [...new Set((code || "").match(/G5[4-9]|G154\s*P\d+/g) || [])];
}
function toast(msg) {
  const box = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

let prog = null;
let pdfDir = null;   // folder z rysunkami PDF (do otwarcia folderu szkicu)
let editing = false; // czy okno jest w trybie edycji

const collapse = s => String(s || "").replace(/\s+/g, " ").trim();
/* podmienia numer O w kodzie na podany (spójność kodu z polem „Numer O”) */
function replaceOnumInCode(code, onum) {
  if (!onum) return code;
  const num = String(onum).replace(/^[Oo]/, "");
  if (/^[ \t]*[Oo]\d+/m.test(code)) return code.replace(/^([ \t]*)[Oo]\d+/m, "$1O" + num);
  return code;
}
/* wyłuskuje numer O z kodu, gdy pole „Numer O” jest puste */
function onumFromCode(code) {
  const m = String(code || "").match(/^[ \t]*[Oo](\d{1,8})/m);
  return m ? "O" + m[1] : "";
}

function render(p) {
  prog = p;
  document.title = (p.name || "Podgląd") + " — CNC Manager";
  document.getElementById("tbTitle").textContent = p.name || "";
  const ob = document.getElementById("tbOnum");
  ob.textContent = p.onum || "";
  ob.style.display = p.onum ? "" : "none";

  const tools = extractTools(p.code);
  const offsets = extractOffsets(p.code);
  const meta = [
    ["Detal", p.detail], ["Nr rysunku", p.drawing], ["Klient", p.client],
    ["Materiał", p.material], ["Utworzono", fmtDate(p.created)], ["Zmieniono", fmtDate(p.modified)],
    ["Plik na dysku", p.file ? (p.dir ? p.dir + "/" : "") + p.file : ""]
  ].filter(m => m[1]);

  document.getElementById("viewPane").innerHTML = `
    <div class="meta-grid">
      ${meta.map(m => `<div class="meta"><span>${esc(m[0])}</span><b>${esc(m[1])}</b></div>`).join("")}
      ${offsets.length ? `<div class="meta"><span>Bazy</span><b>${offsets.map(esc).join(", ")}</b></div>` : ""}
    </div>
    ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${p.note ? `<div class="sect"><h3>Notatka</h3><div class="note-box">${esc(p.note)}</div></div>` : ""}
    <div class="sect"><h3>Kod programu</h3><pre class="code">${hlCode(p.code || "")}</pre></div>
    ${tools.length ? `<div class="sect"><h3>Narzędzia w programie</h3>
      <div class="tools">${tools.map(([t, d]) =>
        `<div class="tool"><span class="tno">${esc(t)}</span><span class="tdesc">${esc(d) || "—"}</span></div>`).join("")}</div></div>` : ""}
    <div class="sect"><h3>Historia wersji</h3>
      ${(p.versions || []).length ? `<div class="vers">${p.versions.slice().reverse().map(v => {
        return `<details class="ver-item">
          <summary>
            <span class="ver-date">${fmtDate(v.date)}</span>
            <span class="ver-note">${esc(v.note || "bez opisu")}</span>
          </summary>
          <div class="ver-body"><pre class="code">${hlCode(v.code || "")}</pre></div>
        </details>`;
      }).join("")}</div>`
      : '<div style="font-size:.83rem;color:#5d6780">Ten program ma tylko wersję bieżącą.</div>'}
    </div>`;
}

/* ── edycja w tym samym oknie (bez powrotu do okna głównego) ── */
function openEditMode() {
  if (!prog) return;
  document.getElementById("eName").value = prog.name || "";
  document.getElementById("eOnum").value = prog.onum || "";
  document.getElementById("eDetail").value = prog.detail || "";
  document.getElementById("eDrawing").value = prog.drawing || "";
  document.getElementById("eClient").value = prog.client || "";
  document.getElementById("eMaterial").value = prog.material || "";
  document.getElementById("eTags").value = (prog.tags || []).join(", ");
  document.getElementById("eNote").value = prog.note || "";
  document.getElementById("eCode").value = prog.code || "";
  document.getElementById("eChange").value = "";
  document.getElementById("eName").classList.remove("bad");
  document.getElementById("viewPane").style.display = "none";
  document.getElementById("editPane").style.display = "";
  document.getElementById("footView").style.display = "none";
  document.getElementById("footEdit").style.display = "";
  document.querySelector(".body").scrollTop = 0;
  editing = true;
  document.getElementById("tbTitle").textContent = "Edycja: " + (prog.name || "");
  setTimeout(() => document.getElementById("eName").focus(), 60);
}

function cancelEdit() {
  document.getElementById("editPane").style.display = "none";
  document.getElementById("viewPane").style.display = "";
  document.getElementById("footEdit").style.display = "none";
  document.getElementById("footView").style.display = "";
  editing = false;
  render(prog);   // przywróć podgląd bieżącego programu
}

function saveEdit() {
  if (!prog) return;
  const name = document.getElementById("eName").value.trim();
  if (!name) {
    document.getElementById("eName").classList.add("bad");
    document.getElementById("eName").focus();
    toast("Podaj nazwę programu");
    return;
  }
  let onum = document.getElementById("eOnum").value.trim().toUpperCase();
  let code = document.getElementById("eCode").value;
  if (!onum) onum = onumFromCode(code);
  if (onum) code = replaceOnumInCode(code, onum);
  const change = document.getElementById("eChange").value.trim();

  const data = {
    name,
    onum,
    detail: document.getElementById("eDetail").value.trim(),
    drawing: document.getElementById("eDrawing").value.trim(),
    client: document.getElementById("eClient").value.trim(),
    material: document.getElementById("eMaterial").value.trim(),
    tags: document.getElementById("eTags").value.split(",").map(t => t.trim()).filter(Boolean),
    note: document.getElementById("eNote").value.trim(),
    code
  };

  // historia wersji (spójnie z oknem głównym) — gdy zmienił się kod
  if (prog.code !== code) {
    prog.versions = prog.versions || [];
    prog.versions.push({ date: prog.modified, note: change || "Poprzednia wersja", code: prog.code });
  }
  Object.assign(prog, data, { modified: Date.now() });

  // zapis w oknie głównym (biblioteka + dysk) BEZ przełączania na okno główne
  window.native.detailAction({ type: "save", id: prog.id, data, change });

  editing = false;
  document.getElementById("editPane").style.display = "none";
  document.getElementById("viewPane").style.display = "";
  document.getElementById("footEdit").style.display = "none";
  document.getElementById("footView").style.display = "";
  render(prog);
  toast("Zapisano zmiany — " + prog.name);
}

document.getElementById("btnCancelEdit").addEventListener("click", cancelEdit);
document.getElementById("btnSaveEdit").addEventListener("click", saveEdit);
/* otwiera folder szkicu (rysunku) tego programu — szkic z pola „Nr rysunku” / nawiasu w kodzie */
document.getElementById("btnSketch").addEventListener("click", async () => {
  if (!prog) return;
  if (!pdfDir) { toast("Najpierw połącz folder z rysunkami PDF w głównym oknie"); return; }
  const sketch = (prog.drawing || prog.detail || "").trim();

  const r = await window.native.openSketch(pdfDir, sketch);
  if (r && r.notFound) toast('Nie znaleziono szkicu „' + sketch + '” — otwarto główny folder rysunków');
  else if (!(r && r.ok)) toast("Nie udało się otworzyć folderu rysunku");
});

/* ─────────── Generator / podgląd konturu 2D (backplot z G-kodu) ───────────
   Rysuje zarys detalu z toru narzędzia tokarki. Płaszczyzna G18 (ZX):
   X = średnica → promień = X/2 (oś pionowa), Z = oś (pozioma).
   Tylko do odczytu — nie modyfikuje ani nie nadpisuje żadnego pliku. */
(function () {
  const ov = document.getElementById("bpOverlay");
  const canvas = document.getElementById("bpCanvas");
  const tip = document.getElementById("bpTip");
  let ctx = null, dpr = 1;
  let model = null;            // { feeds, rapids, empty, zmin, zmax, rmax, maxDia, length }
  let T = { S: 1, tx: 0, ty: 0 }; // transformacja model → ekran
  const opts = { mirror: true, rapids: true, grid: true, holes: true, threads: true };
  let open = false, drag = null, hover = null;
  const mouse = { x: 0, y: 0 };

  const SX = z => z * T.S + T.tx;
  const SY = r => -r * T.S + T.ty;

  /* — parser — */
  function parse(code) {
    const feeds = [], rapids = [], holes = [], threads = [];
    let plane = 18, motion = 0, x = null, z = null;
    let lastComment = "", toolComment = "", thr = null;
    const flushThread = () => {
      if (!thr || thr.rootX == null) { thr = null; return; }
      const rootR = thr.rootX / 2;
      const crestR = (thr.K != null && thr.K > 0) ? rootR + thr.K : rootR + 0.6134 * (thr.pitch || 1);
      addThread(threads, thr.zStart, thr.zEnd, rootR, crestR, thr.pitch);
      thr = null;
    };
    const wre = /([A-Za-z])\s*(-?\d*\.?\d+)/g;
    for (const raw of String(code || "").split(/\r?\n/)) {
      // opis narzędzia (do średnicy wiertła/gwintownika) — z komentarza przy literze T lub tuż nad nią
      const cMatch = raw.match(/\(([^)]*)\)/);
      if (cMatch) lastComment = cMatch[1].trim();
      const hasTool = /(?:^|[^A-Za-z])T\d{1,4}\b/.test(raw);
      if (hasTool) toolComment = cMatch ? cMatch[1].trim() : lastComment;

      const line = raw.replace(/\([^)]*\)/g, " ").trim();
      if (!line) continue;
      let m, words = []; wre.lastIndex = 0;
      while ((m = wre.exec(line))) words.push([m[1].toUpperCase(), parseFloat(m[2])]);
      if (!words.length) continue;

      let np = null, nm = null, g53 = false, home = false, nonmove = false, drill = 0, thread = 0;
      let nx = x, nz = z, R = null, I = null, K = null, Fval = null, axis = false;
      for (const [L, V] of words) {
        if (L === "G") {
          const g = Math.round(V);
          if (g === 53) g53 = true;
          else if (g === 28 || g === 30) home = true;
          else if (g === 17) np = 17; else if (g === 18) np = 18; else if (g === 19) np = 19;
          else if (g === 0) nm = 0; else if (g === 1) nm = 1; else if (g === 2) nm = 2; else if (g === 3) nm = 3;
          else if (g >= 81 && g <= 89) drill = g;   // cykl wiercenia/gwintowania → otwór osiowy
          else if (g === 76 || g === 92 || g === 32 || g === 33 || g === 34) thread = g; // gwintowanie zewn./wewn.
          else if (g === 4 || g === 10 || g === 70 || g === 71 || g === 72 || g === 73 || g === 74 || g === 75 || (g >= 77 && g <= 80)) nonmove = true; // roughing/dwell
        }
        else if (L === "X") { nx = V; axis = true; }
        else if (L === "Z") { nz = V; axis = true; }
        else if (L === "U") { if (x != null) nx = x + V; axis = true; } // przyrostowy X (średnica)
        else if (L === "W") { if (z != null) nz = z + V; axis = true; } // przyrostowy Z
        else if (L === "R") R = V; else if (L === "I") I = V; else if (L === "K") K = V; else if (L === "F") Fval = V;
      }

      // gwintowanie: G76 (jednoblokowy) lub G92/G32/G33/G34 (wieloprzejściowe) → jeden symbol gwintu
      if (thread === 76) {
        flushThread();
        const zEnd = (nz != null ? nz : z), root = (nx != null ? nx : x);
        if (z != null && root != null) {
          const rootR = root / 2;
          const crestR = (K != null && K > 0) ? rootR + K : rootR + 0.6134 * (Fval || 1);
          addThread(threads, z, zEnd, rootR, crestR, Fval || 1);
        }
        x = null; z = null; continue;
      }
      if (thread) {
        if (!thr) thr = { zStart: (z != null ? z : (nz != null ? nz : 0)), zEnd: (nz != null ? nz : z), rootX: (nx != null ? nx : x), pitch: Fval, K: null };
        else {
          if (nx != null) thr.rootX = (thr.rootX != null) ? Math.min(thr.rootX, nx) : nx;
          if (nz != null) thr.zEnd = nz;
          if (Fval != null) thr.pitch = Fval;
        }
        x = null; z = null; continue;
      }
      // aktywny gwint: domykamy TYLKO na realnym końcu operacji (zmiana narzędzia,
      // G53/G28, zmiana płaszczyzny, ruch skrawający G01/2/3, cykl wiercenia).
      // Linie S/M/F, komentarze i dojazdy G00 nie kończą gwintu — inaczej każde
      // przejście stawało się osobnym gwintem (wachlarz linii).
      if (thr) {
        const brk = hasTool || g53 || home || drill || np !== null || nm === 1 || nm === 2 || nm === 3;
        if (!brk) {
          if (nx != null && nz == null && nm === null) thr.rootX = (thr.rootX != null) ? Math.min(thr.rootX, nx) : nx;
          x = null; z = null; continue;
        }
        flushThread();
      }

      // cykl wiercenia / gwintowania sztywnego → otwór osiowy (X≈0, wzdłuż osi Z)
      if (drill) {
        const isTap = (drill === 84 || drill === 74);
        let dia = drillDia(toolComment, isTap);
        if (dia == null) dia = holes.length ? holes[holes.length - 1].dia : 6;
        const zDepth = (nz != null ? nz : (z != null ? z : 0));
        addHole(holes, dia, 0, zDepth, isTap, toolComment);
        x = null; z = null;
        continue;
      }

      if (np !== null && np !== plane) { plane = np; x = null; z = null; if (nm !== null) motion = nm; continue; }
      if (nm !== null) motion = nm;
      if (g53 || home || nonmove) { if (g53 || home) { x = null; z = null; } continue; }
      if (plane !== 18) continue;      // ruchy rysujemy tylko w płaszczyźnie tokarskiej
      if (!axis) continue;

      const known = (x != null && z != null);
      const b = { z: (nz != null ? nz : z), r: ((nx != null ? nx : x) || 0) / 2 };
      if (known) {
        const a = { z, r: x / 2 };
        if (motion === 2 || motion === 3) {
          let prev = a;
          for (const p of arc(a, b, R, I, K, motion === 2)) { feeds.push({ a: prev, b: p }); prev = p; }
        } else (motion === 0 ? rapids : feeds).push({ a, b });
      }
      x = (nx != null ? nx : x); z = (nz != null ? nz : z);
    }
    flushThread();
    return finalize(feeds, rapids, holes, threads);
  }

  /* symbol gwintu: linia wierzchołków (major) + ząbki zygzakiem co pół podziałki (zamiast każdego przejścia) */
  function addThread(threads, zStart, zEnd, rootR, crestR, pitch) {
    const zA = Math.min(zStart, zEnd), zB = Math.max(zStart, zEnd);
    if (!(zB - zA > 0.01) || !(rootR > 0)) return;
    if (!(crestR > rootR)) crestR = rootR + Math.max(0.2, 0.6134 * (pitch || 1));
    const p = (pitch && pitch > 0.05) ? pitch : (zB - zA) / 12;
    const half = p / 2;
    const teeth = Math.min(600, Math.max(2, Math.round((zB - zA) / half)));
    const segs = [{ a: { z: zA, r: crestR }, b: { z: zB, r: crestR } }]; // linia wierzchołków
    let prev = { z: zB, r: crestR };
    for (let i = 1; i <= teeth; i++) {
      const zz = Math.max(zA, zB - i * half);
      const rr = (i % 2) ? rootR : crestR;
      segs.push({ a: prev, b: { z: zz, r: rr } });
      prev = { z: zz, r: rr };
    }
    threads.push({ zA, zB, rootR, crestR, dia: crestR * 2, minDia: rootR * 2, pitch: p, segs });
  }

  /* średnica z opisu narzędzia: „WIERTLO 10.2" → 10.2, „GWINTOWNIK M12" → 12 */
  function drillDia(comment, isTap) {
    if (!comment) return null;
    const c = comment.replace(",", ".");
    if (isTap) { const t = c.match(/M\s?(\d+(?:\.\d+)?)/i); if (t) return parseFloat(t[1]); }
    const n = c.match(/(\d+(?:\.\d+)?)/);
    return n ? parseFloat(n[1]) : null;
  }

  /* zarys otworu (górna strona, r≥0): walec + stożek wiertła lub płaskie dno gwintownika */
  function addHole(holes, dia, zTop, zDepth, isTap, comment) {
    const rad = Math.max(0.1, dia / 2);
    const zHi = Math.max(zTop, zDepth), zLo = Math.min(zTop, zDepth); // zLo = dno
    const segs = [];
    if (!isTap) {
      const tip = Math.min(0.6 * rad, zHi - zLo);                     // stożek wiertła ~118°
      const zBody = zLo + tip;
      segs.push({ a: { z: zHi, r: rad }, b: { z: zBody, r: rad } });  // walec
      segs.push({ a: { z: zBody, r: rad }, b: { z: zLo, r: 0 } });    // stożek do wierzchołka
    } else {
      segs.push({ a: { z: zHi, r: rad }, b: { z: zLo, r: rad } });    // walec (gwint)
      segs.push({ a: { z: zLo, r: rad }, b: { z: zLo, r: 0 } });      // płaskie dno
    }
    holes.push({ dia, rad, zTop: zHi, zDepth: zLo, isTap, comment: comment || "", segs });
  }

  /* — łuk G2/G3 → punkty (w przestrzeni z,promień) — */
  function arc(a, b, R, I, K, cw) {
    let cz, cr;
    if (I != null || K != null) { cr = a.r + (I || 0); cz = a.z + (K || 0); }
    else if (R != null) {
      const d = Math.hypot(b.z - a.z, b.r - a.r) || 1e-9;
      let rad = Math.abs(R); if (rad < d / 2) rad = d / 2;
      const h = Math.sqrt(Math.max(0, rad * rad - (d / 2) * (d / 2)));
      const mz = (a.z + b.z) / 2, mr = (a.r + b.r) / 2;
      const uz = -(b.r - a.r) / d, ur = (b.z - a.z) / d;
      const sign = (cw ? -1 : 1) * (R < 0 ? -1 : 1);
      cz = mz + sign * h * uz; cr = mr + sign * h * ur;
    } else return [b];
    const rad = Math.hypot(a.z - cz, a.r - cr) || 1e-9;
    const a0 = Math.atan2(a.r - cr, a.z - cz);
    const a1 = Math.atan2(b.r - cr, b.z - cz);
    let da = a1 - a0;
    if (cw) { while (da > 0) da -= 2 * Math.PI; } else { while (da < 0) da += 2 * Math.PI; }
    if (Math.abs(da) < 1e-6) da = cw ? -2 * Math.PI : 2 * Math.PI;
    const steps = Math.max(2, Math.ceil(Math.abs(da) / (Math.PI / 24)));
    const out = [];
    for (let i = 1; i <= steps; i++) { const t = a0 + da * (i / steps); out.push({ z: cz + rad * Math.cos(t), r: cr + rad * Math.sin(t) }); }
    return out;
  }

  function finalize(feeds, rapids, holes, threads) {
    holes = holes || []; threads = threads || [];
    const all = [];
    feeds.forEach(s => { all.push(s.a, s.b); });
    rapids.forEach(s => { all.push(s.a, s.b); });
    holes.forEach(h => h.segs.forEach(s => { all.push(s.a, s.b); }));
    threads.forEach(t => t.segs.forEach(s => { all.push(s.a, s.b); }));
    if (!all.length) return { feeds, rapids, holes, threads, empty: true };
    let zmin = 1e9, zmax = -1e9, rmax = -1e9;
    all.forEach(p => { zmin = Math.min(zmin, p.z); zmax = Math.max(zmax, p.z); rmax = Math.max(rmax, p.r); });
    let fz0 = 1e9, fz1 = -1e9, fr = 0;
    feeds.forEach(s => [s.a, s.b].forEach(p => { fz0 = Math.min(fz0, p.z); fz1 = Math.max(fz1, p.z); fr = Math.max(fr, p.r); }));
    zmin = Math.min(zmin, 0); zmax = Math.max(zmax, 0);
    return { feeds, rapids, holes, threads, empty: false, zmin, zmax, rmax: Math.max(rmax, 0), maxDia: fr * 2, length: (fz1 > fz0 ? fz1 - fz0 : 0) };
  }

  /* — dopasowanie widoku — */
  function fit() {
    if (!model || model.empty) { draw(); return; }
    const W = canvas.clientWidth, H = canvas.clientHeight, pad = 56;
    const rMax = model.rmax, rMin = opts.mirror ? -model.rmax : 0;
    const wz = Math.max(1e-6, model.zmax - model.zmin), wr = Math.max(1e-6, rMax - rMin);
    const S = Math.min((W - 2 * pad) / wz, (H - 2 * pad) / wr) || 1;
    const zc = (model.zmin + model.zmax) / 2, rc = (rMin + rMax) / 2;
    T = { S, tx: W / 2 - zc * S, ty: H / 2 + rc * S };
    draw();
  }

  /* — rysowanie — */
  function draw() {
    if (!ctx) return;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (W <= 0 || H <= 0) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, W * 0.35, H);
    g.addColorStop(0, "#6d78ea"); g.addColorStop(1, "#3f45c4");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (!model || model.empty) return;

    if (opts.grid) drawGrid(W, H);

    // oś środkowa (Z) i pionowa przy z=0
    ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,.28)";
    ctx.beginPath(); ctx.moveTo(0, SY(0)); ctx.lineTo(W, SY(0)); ctx.stroke();
    const zx = SX(0);
    if (zx >= 0 && zx <= W) { ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.beginPath(); ctx.moveTo(zx, 0); ctx.lineTo(zx, H); ctx.stroke(); }

    if (opts.mirror) { ctx.globalAlpha = .34; strokeSegs(model.feeds, "#ffd60a", 1.4, null, true); ctx.globalAlpha = 1; }
    if (opts.rapids) strokeSegs(model.rapids, "rgba(255,255,255,.72)", 1, [5, 4], false);
    strokeSegs(model.feeds, "#ffd60a", 1.7, null, false);

    // wiercenia / gwintowanie (otwory osiowe)
    if (opts.holes && model.holes.length) {
      const hs = [];
      model.holes.forEach(h => h.segs.forEach(s => hs.push(s)));
      if (opts.mirror) { ctx.globalAlpha = .5; strokeSegs(hs, "#ffb454", 1.5, null, true); ctx.globalAlpha = 1; }
      strokeSegs(hs, "#ffb454", 1.8, null, false);
    }

    // gwintowanie (symbol gwintu)
    if (opts.threads && model.threads.length) {
      const ts = [];
      model.threads.forEach(t => t.segs.forEach(s => ts.push(s)));
      if (opts.mirror) { ctx.globalAlpha = .5; strokeSegs(ts, "#ff77c8", 1.2, null, true); ctx.globalAlpha = 1; }
      strokeSegs(ts, "#ff77c8", 1.4, null, false);
    }

    drawOrigin();
    if (hover) drawHover();
  }

  function drawGrid(W, H) {
    let mstep = Math.pow(10, Math.round(Math.log10(60 / Math.max(T.S, 1e-9))));
    const cand = [mstep, mstep * 2, mstep * 5, mstep * 10];
    let step = cand[cand.length - 1];
    for (const c of cand) { if (c * T.S >= 46) { step = c; break; } }
    const s = step * T.S;
    if (!isFinite(s) || s < 10) return;
    ctx.setLineDash([]); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.06)";
    for (let x = T.tx - Math.floor(T.tx / s) * s; x <= W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = T.ty - Math.floor(T.ty / s) * s; y <= H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  function strokeSegs(segs, color, w, dash, mirror) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.beginPath();
    for (const s of segs) {
      const ar = mirror ? -s.a.r : s.a.r, br = mirror ? -s.b.r : s.b.r;
      ctx.moveTo(SX(s.a.z), SY(ar)); ctx.lineTo(SX(s.b.z), SY(br));
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  function drawOrigin() {
    const ox = SX(0), oy = SY(0), L = 26;
    arrow(ox, oy, ox + L, oy, "#39d98a"); // Z+ w prawo (zielony)
    arrow(ox, oy, ox, oy - L, "#ff5a6a"); // X+ w górę (czerwony)
  }
  function arrow(x0, y0, x1, y1, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    const a = Math.atan2(y1 - y0, x1 - x0), h = 6;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - h * Math.cos(a - 0.4), y1 - h * Math.sin(a - 0.4));
    ctx.lineTo(x1 - h * Math.cos(a + 0.4), y1 - h * Math.sin(a + 0.4));
    ctx.closePath(); ctx.fill();
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (W <= 0 || H <= 0) return;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    draw();
  }

  function info() {
    const el = document.getElementById("bpInfo");
    if (!model || model.empty) { el.innerHTML = ""; return; }
    const n = model.feeds.length + model.rapids.length;
    el.innerHTML = 'Ø max: <b>' + model.maxDia.toFixed(1) + ' mm</b> &nbsp;•&nbsp; Długość: <b>' +
      model.length.toFixed(1) + ' mm</b> &nbsp;•&nbsp; Segmenty: <b>' + n + '</b>' +
      (model.holes.length ? ' &nbsp;•&nbsp; Otwory: <b>' + model.holes.length + '</b>' : '') +
      (model.threads.length ? ' &nbsp;•&nbsp; Gwinty: <b>' + model.threads.length + '</b>' : '');
  }

  function ensureSized(cb) { if (canvas.clientWidth > 0) cb(); else requestAnimationFrame(() => ensureSized(cb)); }

  /* — odczyt wymiaru po najechaniu na tor — */
  function fmtDim(v) { return (Math.round(v * 1000) / 1000).toString(); }
  function hideTip() { tip.style.display = "none"; }
  function showTip(z, r) {
    tip.innerHTML =
      '<div class="bp-tip-row"><span>Ø</span><b>' + fmtDim(2 * r) + '</b> mm</div>' +
      '<div class="bp-tip-row"><span>Z</span><b>' + fmtDim(z) + '</b> mm</div>' +
      '<div class="bp-tip-row bp-tip-sub"><span>R</span>' + fmtDim(r) + ' mm</div>';
    tip.style.display = "block";
    const W = canvas.clientWidth, H = canvas.clientHeight, pad = 16;
    let x = mouse.x + pad, y = mouse.y + pad;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > W - 6) x = mouse.x - pad - w;
    if (y + h > H - 6) y = mouse.y - pad - h;
    tip.style.left = Math.max(6, x) + "px"; tip.style.top = Math.max(56, y) + "px";
  }

  /* najbliższy punkt/tor do kursora → faktyczny wymiar w tym miejscu.
     Priorytet: wierzchołek (punkt programowany), potem rzut na odcinek. */
  function hitTest(cx, cy) {
    if (!model || model.empty) return null;
    let best = null, bestD = 16 * 16, bestV = null, bestVD = 11 * 11;
    const sides = opts.mirror ? [1, -1] : [1];
    const consider = (seg, sign) => {
      const ax = SX(seg.a.z), ay = SY(sign * seg.a.r), bx = SX(seg.b.z), by = SY(sign * seg.b.r);
      let d = (ax - cx) * (ax - cx) + (ay - cy) * (ay - cy);
      if (d < bestVD) { bestVD = d; bestV = { z: seg.a.z, r: seg.a.r, sign }; }
      d = (bx - cx) * (bx - cx) + (by - cy) * (by - cy);
      if (d < bestVD) { bestVD = d; bestV = { z: seg.b.z, r: seg.b.r, sign }; }
      const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
      let t = L2 ? ((cx - ax) * dx + (cy - ay) * dy) / L2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ax + t * dx, py = ay + t * dy;
      d = (px - cx) * (px - cx) + (py - cy) * (py - cy);
      if (d < bestD) { bestD = d; best = { z: seg.a.z + t * (seg.b.z - seg.a.z), r: seg.a.r + t * (seg.b.r - seg.a.r), sign }; }
    };
    for (const s of model.feeds) for (const sg of sides) consider(s, sg);
    if (opts.rapids) for (const s of model.rapids) for (const sg of sides) consider(s, sg);
    if (opts.holes) for (const h of model.holes) for (const s of h.segs) for (const sg of sides) consider(s, sg);
    if (opts.threads) for (const t of model.threads) for (const s of t.segs) for (const sg of sides) consider(s, sg);
    return bestV || best;
  }

  function drawHover() {
    const hx = SX(hover.z), hy = SY(hover.sign * hover.r);
    ctx.save();
    ctx.setLineDash([4, 3]); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, SY(0)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(hx, hy, 4.5, 0, 2 * Math.PI);
    ctx.fillStyle = "#22d3ee"; ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = "#08111f"; ctx.stroke();
    ctx.restore();
  }

  function openBp() {
    if (!prog) return;
    document.getElementById("bpTitle").textContent = "Podgląd konturu — " + (prog.name || "program");
    const on = document.getElementById("bpOnum");
    on.textContent = prog.onum || ""; on.style.display = prog.onum ? "" : "none";
    ov.style.display = "flex";
    open = true;
    if (!ctx) ctx = canvas.getContext("2d");
    model = parse(prog.code || "");
    document.getElementById("bpEmpty").style.display = model.empty ? "grid" : "none";
    syncBtns();
    hover = null; hideTip();
    ensureSized(() => { resize(); fit(); info(); });
  }
  function closeBp() { ov.style.display = "none"; open = false; hover = null; hideTip(); }

  function syncBtns() {
    document.getElementById("bpMirror").classList.toggle("on", opts.mirror);
    document.getElementById("bpRapids").classList.toggle("on", opts.rapids);
    document.getElementById("bpHoles").classList.toggle("on", opts.holes);
    document.getElementById("bpThreads").classList.toggle("on", opts.threads);
    document.getElementById("bpGrid").classList.toggle("on", opts.grid);
  }

  // interakcje myszą
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const mz = (cx - T.tx) / T.S, mr = -(cy - T.ty) / T.S;
    T.S *= f; T.tx = cx - mz * T.S; T.ty = cy + mr * T.S;
    hover = null; hideTip(); draw();
  }, { passive: false });
  canvas.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, tx: T.tx, ty: T.ty }; canvas.classList.add("drag"); hover = null; hideTip(); });
  window.addEventListener("mousemove", e => { if (!drag) return; T.tx = drag.tx + (e.clientX - drag.x); T.ty = drag.ty + (e.clientY - drag.y); draw(); });
  window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("drag"); });
  window.addEventListener("resize", () => { if (open) { resize(); } });

  // najechanie na tor → znacznik + odczyt wymiaru (Ø / Z / R)
  canvas.addEventListener("mousemove", e => {
    if (drag || !open || !model || model.empty) return;
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    const hit = hitTest(mouse.x, mouse.y);
    if (hit) { hover = hit; showTip(hit.z, hit.r); } else { hover = null; hideTip(); }
    draw();
  });
  canvas.addEventListener("mouseleave", () => { hover = null; hideTip(); if (open) draw(); });

  document.getElementById("bpFit").addEventListener("click", () => { hover = null; hideTip(); resize(); fit(); });
  document.getElementById("bpMirror").addEventListener("click", () => { opts.mirror = !opts.mirror; hover = null; hideTip(); syncBtns(); fit(); });
  document.getElementById("bpRapids").addEventListener("click", () => { opts.rapids = !opts.rapids; hover = null; hideTip(); syncBtns(); draw(); });
  document.getElementById("bpHoles").addEventListener("click", () => { opts.holes = !opts.holes; hover = null; hideTip(); syncBtns(); draw(); });
  document.getElementById("bpThreads").addEventListener("click", () => { opts.threads = !opts.threads; hover = null; hideTip(); syncBtns(); draw(); });
  document.getElementById("bpGrid").addEventListener("click", () => { opts.grid = !opts.grid; hover = null; hideTip(); syncBtns(); draw(); });
  document.getElementById("bpClose").addEventListener("click", closeBp);
  document.addEventListener("keydown", e => {
    if (!open) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeBp(); }
    else if (e.key === "0" || e.key.toLowerCase() === "f") { e.preventDefault(); hover = null; hideTip(); resize(); fit(); }
  }, true);

  window.__openBackplot = openBp;
})();

document.getElementById("btnBackplot").addEventListener("click", () => {
  if (!prog) return;
  window.__openBackplot();
});

/* skróty klawiszowe w trybie edycji: Ctrl+S = zapisz, Esc = anuluj */
document.addEventListener("keydown", e => {
  if (!editing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEdit(); }
  else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
});

/* start — pobierz dane programu z procesu głównego */
(async () => {
  try {
    const data = await window.native.getDetailData();
    if (!data || !data.program) { document.getElementById("viewPane").innerHTML =
      '<div style="padding:40px;text-align:center;color:#8d96ad">Nie udało się wczytać programu.</div>'; return; }
    if (data.theme === "light") document.body.classList.add("light");
    if (data.accent && data.accent !== "default") document.body.classList.add("theme-" + data.accent);
    if (data.motion === false) document.body.classList.add("no-motion");
    pdfDir = data.pdfDir || null;
    render(data.program);
  } catch (e) {
    document.getElementById("viewPane").innerHTML =
      '<div style="padding:40px;text-align:center;color:#8d96ad">Błąd: ' + esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
