<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podgląd programu — CNC Manager</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
  :root{
    --bg0:#0c1020;
    --bg1:#141a2e;
    --card:rgba(255,255,255,.075);
    --stroke:rgba(255,255,255,.13);
    --stroke-hi:rgba(255,255,255,.24);
    --txt:#e9edf7;
    --mut:#8d96ad;
    --ac1:#22d3ee;
    --ac2:#6366f1;
    --ac3:#a855f7;
    --ac1-rgb:34,211,238;
    --ac2-rgb:99,102,241;
    --ac3-rgb:168,85,247;
    --ok:#34d399;
    --warn:#fbbf24;
    --err:#f87171;
    --grad:linear-gradient(135deg,#22d3ee,#6366f1 55%,#a855f7);
    --grad-soft:linear-gradient(135deg,rgba(var(--ac1-rgb),.16),rgba(var(--ac2-rgb),.16) 55%,rgba(var(--ac3-rgb),.16));
    --radius:14px;
  }
  body.theme-orange{
    --ac1:#fbbf24; --ac1-rgb:251,191,36;
    --ac2:#f97316; --ac2-rgb:249,115,22;
    --ac3:#fb923c; --ac3-rgb:251,146,60;
    --grad:linear-gradient(135deg,#fbbf24,#fb923c 42%,#f97316);
  }
  body.theme-green{
    --ac1:#4ade80; --ac1-rgb:74,222,128;
    --ac2:#22c55e; --ac2-rgb:34,197,94;
    --ac3:#34d399; --ac3-rgb:52,211,153;
    --grad:linear-gradient(135deg,#4ade80,#22c55e 45%,#16a34a);
  }
  body.theme-red{
    --ac1:#fb7185; --ac1-rgb:251,113,133;
    --ac2:#ef4444; --ac2-rgb:239,68,68;
    --ac3:#f87171; --ac3-rgb:248,113,113;
    --grad:linear-gradient(135deg,#fb7185,#ef4444 45%,#dc2626);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#2a3350 transparent}
  body{
    font-family:'Rajdhani','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    font-weight:500;
    background:var(--bg0);color:var(--txt);
    height:100vh;overflow:hidden;display:flex;flex-direction:column;
  }
  .bg{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
  }
  .glow{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
  .glow.g1{
    width:1300px;height:900px;top:-22%;right:-12%;
    background:radial-gradient(closest-side,rgba(var(--ac3-rgb),.22),transparent 70%);
    animation:drift1 30s ease-in-out infinite alternate;
  }
  .glow.g2{
    width:1150px;height:850px;top:2%;left:-16%;
    background:radial-gradient(closest-side,rgba(var(--ac1-rgb),.16),transparent 70%);
    animation:drift2 38s ease-in-out infinite alternate;
  }
  .glow.g3{
    width:1050px;height:1050px;bottom:-34%;left:32%;
    background:radial-gradient(closest-side,rgba(var(--ac2-rgb),.18),transparent 70%);
    animation:drift3 26s ease-in-out infinite alternate;
  }
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(-100px,64px) scale(1.1)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(84px,56px) scale(1.12)}}
  @keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(64px,-72px) scale(1.07)}}
  @media (prefers-reduced-motion: reduce){.glow{animation:none}}

  /* ── zintegrowany pasek okna ── */
  .titlebar{
    position:sticky;top:0;z-index:50;flex:none;
    display:flex;align-items:center;gap:12px;height:44px;padding:0 4px 0 16px;
    background:rgba(8,11,22,.82);backdrop-filter:blur(18px);
    border-bottom:1px solid var(--stroke);
    -webkit-app-region:drag;
  }
  .titlebar .tb-icon{
    width:26px;height:26px;border-radius:8px;flex:none;background:var(--grad);
    display:grid;place-items:center;box-shadow:0 3px 12px rgba(var(--ac2-rgb),.45);
  }
  .titlebar .tb-icon svg{width:15px;height:15px}
  .tb-title{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .tb-onum{
    font-family:'Orbitron','Rajdhani',sans-serif;font-size:.95rem;font-weight:800;
    padding:5px 12px;border-radius:9px;flex:none;letter-spacing:.03em;
    background:var(--grad-soft);border:1px solid rgba(var(--ac2-rgb),.55);color:#dbe3ff;
    -webkit-app-region:no-drag;
  }
  .win-ctrl{display:flex;align-items:center;gap:1px;flex:none;-webkit-app-region:no-drag}
  .win-btn{
    width:42px;height:44px;border:none;background:transparent;color:var(--mut);
    cursor:pointer;display:grid;place-items:center;font-size:.9rem;
    transition:background .15s,color .15s;
  }
  .win-btn:hover{background:rgba(255,255,255,.08);color:var(--txt)}
  .win-btn:active{background:rgba(255,255,255,.12)}
  .win-btn.close:hover{background:rgba(248,113,113,.22);color:#fff}

  /* ── treść ── */
  .body{flex:1;overflow:auto;padding:22px 24px}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .meta{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:11px;padding:10px 12px}
  .meta span{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5d6780;margin-bottom:3px}
  .meta b{font-size:.87rem;font-weight:600;word-break:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:999px;
    background:rgba(var(--ac1-rgb),.10);border:1px solid rgba(var(--ac1-rgb),.28);color:#7dd3fc}
  .sect{margin-top:20px}
  .sect>h3{
    font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  .sect>h3::after{content:"";flex:1;height:1px;background:var(--stroke)}
  pre.code{
    background:rgba(0,0,0,.42);border:1px solid var(--stroke);border-radius:13px;
    padding:16px 18px;overflow:auto;
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.83rem;line-height:1.6;color:#cdd6ea;
  }
  .tk-com{color:#6ee7a0;font-style:italic}
  .tk-g{color:#67e8f9;font-weight:600}
  .tk-m{color:#f0abfc;font-weight:600}
  .tk-n{color:#818cf8}
  .tk-t{color:#fbbf24;font-weight:700}
  .tk-f{color:#fda4af}
  .tk-x{color:#e9edf7}
  .tk-pct{color:#5d6780}
  .tools{display:flex;flex-direction:column;gap:7px}
  .tool{display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.03);border:1px solid var(--stroke);
    border-radius:10px;padding:9px 13px;font-size:.85rem}
  .tool .tno{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--warn);
    background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);
    border-radius:7px;padding:3px 9px;flex:none}
  .tool .tdesc{color:#b9c2d8}
  .note-box{font-size:.88rem;color:#b9c2d8;line-height:1.55}
  .vers{display:flex;flex-direction:column;gap:8px}
  .ver-item{background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:11px;overflow:hidden}
  .ver-item summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:11px 14px;cursor:pointer;list-style:none;font-size:.85rem;transition:background .15s}
  .ver-item summary::-webkit-details-marker{display:none}
  .ver-item summary:hover{background:rgba(255,255,255,.04)}
  .ver-date{font-weight:600;color:#b9c2d8}
  .ver-note{color:var(--mut);flex:1}
  .ver-body{padding:0 14px 14px}

  /* ── stopka z akcjami ── */
  .foot{
    flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 20px;border-top:1px solid var(--stroke);
    background:rgba(8,11,22,.55);backdrop-filter:blur(10px);
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:11px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.05);color:var(--txt);
    font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:transform .12s,border-color .2s,background .2s;
  }
  .btn:hover{border-color:var(--stroke-hi);background:rgba(255,255,255,.09)}
  .btn:active{transform:translateY(1px) scale(.97)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn-primary{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 18px rgba(var(--ac2-rgb),.40)}
  .btn-primary:hover{background:var(--grad);box-shadow:0 6px 24px rgba(var(--ac2-rgb),.55)}
  .btn-danger{color:#fca5a5}
  .btn-danger:hover{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.10)}

  /* ── formularz edycji (w tym samym oknie) ── */
  .efgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.efgrid{grid-template-columns:1fr}}
  .efield{display:flex;flex-direction:column;gap:6px}
  .efield.wide{grid-column:1/-1}
  .efield label{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
  .efield input,.efield textarea{
    padding:10px 13px;border-radius:11px;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    color:var(--txt);font-size:.9rem;font-family:inherit;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .efield textarea{resize:vertical;min-height:60px}
  .efield textarea.code-in{
    font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;
    font-size:.84rem;min-height:280px;line-height:1.55;
    background:rgba(0,0,0,.35);white-space:pre;
  }
  .efield input:focus,.efield textarea:focus{
    border-color:var(--ac2);
    box-shadow:0 0 0 3px rgba(var(--ac2-rgb),.18),0 0 20px rgba(var(--ac2-rgb),.12);
  }
  .efield input.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
  body.light .efield input,body.light .efield textarea{background:rgba(15,23,42,.05)}
  body.light .efield textarea.code-in{background:#111726;color:#e9edf7}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242c48;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#2f3a5e}

  /* ── toast ── */
  #toast{position:fixed;bottom:70px;left:50%;translate:-50% 0;z-index:200;
    display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
  .toast{padding:11px 20px;border-radius:12px;font-size:.86rem;font-weight:600;
    background:linear-gradient(135deg,rgba(var(--ac1-rgb),.18),rgba(var(--ac2-rgb),.18));
    border:1px solid rgba(var(--ac2-rgb),.5);color:var(--txt);backdrop-filter:blur(12px);
    box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .25s ease both}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ── jasny motyw ── */
  body.light{
    --bg0:#dfe4ee;--bg1:#ccd4e4;
    --card:rgba(255,255,255,.9);--stroke:rgba(15,23,42,.14);--stroke-hi:rgba(15,23,42,.3);
    --txt:#1b2333;--mut:#5b6474;
  }
  body.light .glow.g1{background:radial-gradient(closest-side,rgba(var(--ac3-rgb),.15),transparent 70%)}
  body.light .glow.g2{background:radial-gradient(closest-side,rgba(var(--ac1-rgb),.14),transparent 70%)}
  body.light .glow.g3{background:radial-gradient(closest-side,rgba(var(--ac2-rgb),.12),transparent 70%)}
  body.light .titlebar{background:rgba(255,255,255,.85)}
  body.light .foot{background:rgba(255,255,255,.6)}
  body.light .win-btn:hover{background:rgba(15,23,42,.10)}
  body.light .win-btn.close:hover{background:rgba(248,113,113,.85);color:#fff}
  body.light .meta,body.light .tool,body.light .ver-item{background:rgba(15,23,42,.035)}
  body.light .tb-onum{color:#4338ca}
  body.light .tag{color:#0e7490;background:rgba(14,116,144,.08);border-color:rgba(14,116,144,.3)}
  body.light .note-box,body.light .tool .tdesc,body.light .ver-date{color:#3a465c}
  body.light .btn{background:rgba(255,255,255,.75)}
  body.light .btn:hover{background:#fff}
  body.light .btn-primary{background:var(--grad);color:#fff}
  body.light .toast{color:#1b2333;background:linear-gradient(135deg,rgba(var(--ac1-rgb),.20),rgba(var(--ac2-rgb),.16)),#fff}
  body.light ::-webkit-scrollbar-thumb{background:#c3cbdc}
</style>
</head>
<body>
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

<div class="titlebar">
  <div class="tb-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="8"></circle>
      <circle cx="12" cy="12" r="2.6" fill="#fff" stroke="none"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
  </div>
  <span class="tb-title" id="tbTitle">Podgląd programu</span>
  <span class="tb-onum" id="tbOnum" style="display:none"></span>
  <div class="win-ctrl">
    <button class="win-btn" id="btnMin" title="Minimalizuj">&#8211;</button>
    <button class="win-btn" id="btnMax" title="Maksymalizuj">&#9633;</button>
    <button class="win-btn close" id="btnClose" title="Zamknij">&#10005;</button>
  </div>
</div>

<div class="body">
  <div id="viewPane"></div>
  <div id="editPane" style="display:none">
    <div class="efgrid">
      <div class="efield"><label>Nazwa programu</label><input id="eName" type="text"></div>
      <div class="efield"><label>Numer O</label><input id="eOnum" type="text" placeholder="O00125"></div>
      <div class="efield"><label>Detal</label><input id="eDetail" type="text"></div>
      <div class="efield"><label>Nr rysunku</label><input id="eDrawing" type="text"></div>
      <div class="efield"><label>Klient</label><input id="eClient" type="text"></div>
      <div class="efield"><label>Materiał</label><input id="eMaterial" type="text"></div>
      <div class="efield wide"><label>Tagi (po przecinku)</label><input id="eTags" type="text" placeholder="wałek, gwint, nierdzewka"></div>
      <div class="efield wide"><label>Notatka</label><textarea id="eNote" rows="2"></textarea></div>
      <div class="efield wide"><label>Opis zmian — do historii wersji</label><input id="eChange" type="text" placeholder="np. zmieniony posuw wykańczaka z F0.15 na F0.2"></div>
      <div class="efield wide"><label>Kod programu — G-kod</label><textarea id="eCode" class="code-in" spellcheck="false"></textarea></div>
    </div>
  </div>
</div>

<div class="foot" id="footView">
  <button class="btn btn-danger" id="btnDelete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"></path>
    </svg>
    Usuń
  </button>
  <button class="btn" id="btnSketch" title="Otwórz w Eksploratorze folder szkicu (rysunku) przypisanego do tego programu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path>
    </svg>
    Otwórz folder rysunku
  </button>
  <span style="flex:1"></span>
  <button class="btn" id="btnCopy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="12" height="12" rx="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    Kopiuj kod
  </button>
  <button class="btn" id="btnDownload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"></path>
    </svg>
    Pobierz .nc
  </button>
  <button class="btn btn-primary" id="btnEdit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
    </svg>
    Edytuj
  </button>
</div>

<div class="foot" id="footEdit" style="display:none">
  <button class="btn" id="btnCancelEdit">Anuluj</button>
  <span style="flex:1"></span>
  <button class="btn btn-primary" id="btnSaveEdit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
      <path d="M17 21v-8H7v8M7 3v5h8"></path>
    </svg>
    Zapisz program
  </button>
</div>

<div id="toast"></div>

<script>
"use strict";
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmtDate = t => new Date(t).toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" }) +
  " " + new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });

function hlCode(code) {
  return esc(code).replace(/\([^)\n]*\)?|[A-Za-z][+-]?\d+\.?\d*|%/g, tok => {
    if (tok[0] === "(") return '<span class="tk-com">' + tok + "</span>";
    if (tok === "%") return '<span class="tk-pct">%</span>';
    const L = tok[0].toUpperCase();
    if (L === "G") return '<span class="tk-g">' + tok + "</span>";
    if (L === "M") return '<span class="tk-m">' + tok + "</span>";
    if (L === "O" || L === "N") return '<span class="tk-n">' + tok + "</span>";
    if (L === "T") return '<span class="tk-t">' + tok + "</span>";
    if (L === "S" || L === "F") return '<span class="tk-f">' + tok + "</span>";
    return '<span class="tk-x">' + tok + "</span>";
  });
}
function extractTools(code) {
  const map = new Map();
  (code || "").split("\n").forEach(line => {
    const m = line.match(/(?:^|[^A-Za-z(])T(\d{2,4})/);
    if (m) {
      const key = "T" + m[1];
      const com = (line.match(/\(([^)]*)\)/) || [])[1] || "";
      if (!map.has(key) || com) map.set(key, com.trim());
    }
  });
  return [...map.entries()];
}
function extractOffsets(code) {
  return [...new Set((code || "").match(/G5[4-9]|G154\s*P\d+/g) || [])];
}
function toast(msg) {
  const box = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

let prog = null;
let pdfDir = null;   // folder z rysunkami PDF (do otwarcia folderu szkicu)
let editing = false; // czy okno jest w trybie edycji

const collapse = s => String(s || "").replace(/\s+/g, " ").trim();
/* podmienia numer O w kodzie na podany (spójność kodu z polem „Numer O”) */
function replaceOnumInCode(code, onum) {
  if (!onum) return code;
  const num = String(onum).replace(/^[Oo]/, "");
  if (/^[ \t]*[Oo]\d+/m.test(code)) return code.replace(/^([ \t]*)[Oo]\d+/m, "$1O" + num);
  return code;
}
/* wyłuskuje numer O z kodu, gdy pole „Numer O” jest puste */
function onumFromCode(code) {
  const m = String(code || "").match(/^[ \t]*[Oo](\d{1,5})/m);
  return m ? "O" + m[1] : "";
}

function render(p) {
  prog = p;
  document.title = (p.name || "Podgląd") + " — CNC Manager";
  document.getElementById("tbTitle").textContent = p.name || "";
  const ob = document.getElementById("tbOnum");
  ob.textContent = p.onum || "";
  ob.style.display = p.onum ? "" : "none";

  const tools = extractTools(p.code);
  const offsets = extractOffsets(p.code);
  const meta = [
    ["Detal", p.detail], ["Nr rysunku", p.drawing], ["Klient", p.client],
    ["Materiał", p.material], ["Utworzono", fmtDate(p.created)], ["Zmieniono", fmtDate(p.modified)],
    ["Plik na dysku", p.file ? (p.dir ? p.dir + "/" : "") + p.file : ""]
  ].filter(m => m[1]);

  document.getElementById("viewPane").innerHTML = `
    <div class="meta-grid">
      ${meta.map(m => `<div class="meta"><span>${esc(m[0])}</span><b>${esc(m[1])}</b></div>`).join("")}
      ${offsets.length ? `<div class="meta"><span>Bazy</span><b>${offsets.map(esc).join(", ")}</b></div>` : ""}
    </div>
    ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${p.note ? `<div class="sect"><h3>Notatka</h3><div class="note-box">${esc(p.note)}</div></div>` : ""}
    <div class="sect"><h3>Kod programu</h3><pre class="code">${hlCode(p.code || "")}</pre></div>
    ${tools.length ? `<div class="sect"><h3>Narzędzia w programie</h3>
      <div class="tools">${tools.map(([t, d]) =>
        `<div class="tool"><span class="tno">${esc(t)}</span><span class="tdesc">${esc(d) || "—"}</span></div>`).join("")}</div></div>` : ""}
    <div class="sect"><h3>Historia wersji</h3>
      ${(p.versions || []).length ? `<div class="vers">${p.versions.slice().reverse().map(v => {
        return `<details class="ver-item">
          <summary>
            <span class="ver-date">${fmtDate(v.date)}</span>
            <span class="ver-note">${esc(v.note || "bez opisu")}</span>
          </summary>
          <div class="ver-body"><pre class="code">${hlCode(v.code || "")}</pre></div>
        </details>`;
      }).join("")}</div>`
      : '<div style="font-size:.83rem;color:#5d6780">Ten program ma tylko wersję bieżącą.</div>'}
    </div>`;
}

/* sterowanie oknem */
document.getElementById("btnMin").addEventListener("click", () => window.native.minimize());
document.getElementById("btnMax").addEventListener("click", () => window.native.toggleMaximize());
document.getElementById("btnClose").addEventListener("click", () => window.native.close());

/* akcje */
document.getElementById("btnCopy").addEventListener("click", async () => {
  if (!prog) return;
  try {
    await navigator.clipboard.writeText(prog.code || "");
    toast("Skopiowano kod programu do schowka");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = prog.code || "";
    ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Skopiowano kod programu do schowka"); }
    catch (e2) { toast("Nie udało się skopiować kodu"); }
    document.body.removeChild(ta);
  }
});
document.getElementById("btnDownload").addEventListener("click", () => {
  if (!prog) return;
  window.native.detailAction({ type: "download", id: prog.id });
  toast("Pobieranie przez okno główne…");
});
document.getElementById("btnEdit").addEventListener("click", () => {
  if (!prog) return;
  openEditMode();
});
document.getElementById("btnDelete").addEventListener("click", () => {
  if (!prog) return;
  window.native.detailAction({ type: "delete", id: prog.id, close: true, focusMain: true });
});

/* ── edycja w tym samym oknie (bez powrotu do okna głównego) ── */
function openEditMode() {
  if (!prog) return;
  document.getElementById("eName").value = prog.name || "";
  document.getElementById("eOnum").value = prog.onum || "";
  document.getElementById("eDetail").value = prog.detail || "";
  document.getElementById("eDrawing").value = prog.drawing || "";
  document.getElementById("eClient").value = prog.client || "";
  document.getElementById("eMaterial").value = prog.material || "";
  document.getElementById("eTags").value = (prog.tags || []).join(", ");
  document.getElementById("eNote").value = prog.note || "";
  document.getElementById("eCode").value = prog.code || "";
  document.getElementById("eChange").value = "";
  document.getElementById("eName").classList.remove("bad");
  document.getElementById("viewPane").style.display = "none";
  document.getElementById("editPane").style.display = "";
  document.getElementById("footView").style.display = "none";
  document.getElementById("footEdit").style.display = "";
  document.querySelector(".body").scrollTop = 0;
  editing = true;
  document.getElementById("tbTitle").textContent = "Edycja: " + (prog.name || "");
  setTimeout(() => document.getElementById("eName").focus(), 60);
}

function cancelEdit() {
  document.getElementById("editPane").style.display = "none";
  document.getElementById("viewPane").style.display = "";
  document.getElementById("footEdit").style.display = "none";
  document.getElementById("footView").style.display = "";
  editing = false;
  render(prog);   // przywróć podgląd bieżącego programu
}

function saveEdit() {
  if (!prog) return;
  const name = document.getElementById("eName").value.trim();
  if (!name) {
    document.getElementById("eName").classList.add("bad");
    document.getElementById("eName").focus();
    toast("Podaj nazwę programu");
    return;
  }
  let onum = document.getElementById("eOnum").value.trim().toUpperCase();
  let code = document.getElementById("eCode").value;
  if (!onum) onum = onumFromCode(code);
  if (onum) code = replaceOnumInCode(code, onum);
  const change = document.getElementById("eChange").value.trim();

  const data = {
    name,
    onum,
    detail: document.getElementById("eDetail").value.trim(),
    drawing: document.getElementById("eDrawing").value.trim(),
    client: document.getElementById("eClient").value.trim(),
    material: document.getElementById("eMaterial").value.trim(),
    tags: document.getElementById("eTags").value.split(",").map(t => t.trim()).filter(Boolean),
    note: document.getElementById("eNote").value.trim(),
    code
  };

  // historia wersji (spójnie z oknem głównym) — gdy zmienił się kod
  if (prog.code !== code) {
    prog.versions = prog.versions || [];
    prog.versions.push({ date: prog.modified, note: change || "Poprzednia wersja", code: prog.code });
  }
  Object.assign(prog, data, { modified: Date.now() });

  // zapis w oknie głównym (biblioteka + dysk) BEZ przełączania na okno główne
  window.native.detailAction({ type: "save", id: prog.id, data, change });

  editing = false;
  document.getElementById("editPane").style.display = "none";
  document.getElementById("viewPane").style.display = "";
  document.getElementById("footEdit").style.display = "none";
  document.getElementById("footView").style.display = "";
  render(prog);
  toast("Zapisano zmiany — " + prog.name);
}

document.getElementById("btnCancelEdit").addEventListener("click", cancelEdit);
document.getElementById("btnSaveEdit").addEventListener("click", saveEdit);
/* otwiera folder szkicu (rysunku) tego programu — szkic z pola „Nr rysunku” / nawiasu w kodzie */
document.getElementById("btnSketch").addEventListener("click", async () => {
  if (!prog) return;
  if (!pdfDir) { toast("Najpierw połącz folder z rysunkami PDF w głównym oknie"); return; }
  const sketch = (prog.drawing || prog.detail || "").trim();
  if (!window.native.openSketch) { toast("Funkcja niedostępna"); return; }
  const r = await window.native.openSketch(pdfDir, sketch);
  if (r && r.notFound) toast('Nie znaleziono szkicu „' + sketch + '” — otwarto główny folder rysunków');
  else if (!(r && r.ok)) toast("Nie udało się otworzyć folderu rysunku");
});

/* skróty klawiszowe w trybie edycji: Ctrl+S = zapisz, Esc = anuluj */
document.addEventListener("keydown", e => {
  if (!editing) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEdit(); }
  else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
});

/* start — pobierz dane programu z procesu głównego */
(async () => {
  try {
    const data = await window.native.getDetailData();
    if (!data || !data.program) { document.getElementById("viewPane").innerHTML =
      '<div style="padding:40px;text-align:center;color:#8d96ad">Nie udało się wczytać programu.</div>'; return; }
    if (data.theme === "light") document.body.classList.add("light");
    if (data.accent && data.accent !== "default") document.body.classList.add("theme-" + data.accent);
    pdfDir = data.pdfDir || null;
    render(data.program);
  } catch (e) {
    document.getElementById("viewPane").innerHTML =
      '<div style="padding:40px;text-align:center;color:#8d96ad">Błąd: ' + esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
